<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats | Nara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Custom scrollbar for leaderboard */
        .leaderboard-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .leaderboard-scroll::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .leaderboard-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .leaderboard-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .player-card {
            transition: transform 0.2s, background-color 0.2s;
        }
        .player-card:hover {
            transform: translateY(-2px);
            background-color: #1f2937;
        }
        
        .status-indicator {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid #111827; /* Matches card bg */
            z-index: 10;
        }
        .status-online {
            background-color: #10b981; /* green-500 */
        }
        .status-offline {
            background-color: #ef4444; /* red-500 */
        }

        /* Custom Tooltip */
        .time-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            padding: 6px 10px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 20;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .group:hover .time-tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
    <script src="../components/navbar.js"></script>
    <custom-navbar></custom-navbar>

    <div class="h-[100px]"></div>

    <main class="flex-grow py-10 px-4">
        <div class="max-w-[95%] mx-auto w-full flex flex-col lg:flex-row gap-8">
            
            <!-- Left Sidebar: Leaderboard (20%) -->
            <div class="w-full lg:w-1/5 flex flex-col gap-6">
                <div class="bg-gray-900 rounded-lg border border-gray-800 p-4 h-fit sticky top-24">
                    <h2 class="text-2xl font-bold text-primary mb-4 flex items-center gap-2">
                        <i data-feather="bar-chart-2"></i> Leaderboard
                    </h2>
                    
                    <!-- Tabs -->
                    <div class="flex gap-2 mb-4 bg-gray-800 p-1 rounded-lg">
                        <button onclick="switchLeaderboard('weekly')" id="tab-weekly" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors bg-nara-red text-white font-bold">Weekly</button>
                        <button onclick="switchLeaderboard('monthly')" id="tab-monthly" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white">Monthly</button>
                        <button onclick="switchLeaderboard('alltime')" id="tab-alltime" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white">All-Time</button>
                    </div>

                    <!-- List -->
                    <div id="leaderboard-list" class="space-y-3 leaderboard-scroll max-h-[60vh] overflow-y-auto pr-2">
                        <!-- Populated by JS -->
                        <div class="text-center text-gray-500 py-4">Loading...</div>
                    </div>
                    
                    <div class="mt-4 text-xs text-gray-500 text-center border-t border-gray-800 pt-3">
                        Updated daily at 12am UTC
                    </div>
                </div>
            </div>

            <!-- Right Content: Player Grid (80%) -->
            <div class="w-full lg:w-4/5">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h1 class="text-4xl font-bold text-primary flex items-center gap-3">
                        Online Players 
                        <span class="text-gray-400 text-2xl flex items-center gap-2">
                            <i data-feather="users" class="w-6 h-6"></i> <span id="header-count">0</span>
                        </span>
                    </h1>
                    
                    <!-- Search -->
                    <div class="relative w-full md:w-[30%]">
                        <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="text" id="player-search" placeholder="Search players..." 
                               class="w-full pl-10 pr-4 py-2 bg-gray-900 border border-gray-700 rounded-full text-white placeholder-gray-400 focus:outline-none focus:border-nara-red transition-colors">
                    </div>
                </div>

                <!-- Grid -->
                <div id="player-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
                    <!-- Populated by JS -->
                    <div class="col-span-full text-center py-12 text-gray-500">
                        Loading player data...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>
    <script src="../components/footer.js"></script>
    
    <script>
        feather.replace();

        // State
        let allPlayers = [];
        let leaderboardData = [];
        let currentLeaderboardTab = 'weekly';

        // Image Hashing State
        const badHashes = new Set();
        const hashCanvas = document.createElement('canvas');
        hashCanvas.width = 32;
        hashCanvas.height = 32;
        const hashCtx = hashCanvas.getContext('2d', { willReadFrequently: true });

        async function computeImageHash(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    hashCtx.clearRect(0, 0, 32, 32);
                    hashCtx.drawImage(img, 0, 0, 32, 32);
                    resolve(hashCanvas.toDataURL());
                };
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function initBadHashes() {
            // Load reference images to compare against
            const sources = ['../static/black.png', '../static/steve.png']; 
            
            for (const src of sources) {
                const hash = await computeImageHash(src);
                if (hash) {
                    badHashes.add(hash);
                }
            }
        }

        // --- Leaderboard Logic ---

        async function loadLeaderboard() {
            try {
                const response = await fetch('../data/leaderboard.csv');
                if (!response.ok) throw new Error('Failed to load leaderboard');
                const csvText = await response.text();
                
                // Expected CSV format with headers: Username,Weekly,Monthly,AllTime
                const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
                leaderboardData = results.data;
                renderLeaderboard();
            } catch (error) {
                console.error('Leaderboard error:', error);
                document.getElementById('leaderboard-list').innerHTML = '<div class="text-center text-gray-500 text-sm py-4">Leaderboard data unavailable</div>';
            }
        }

        function switchLeaderboard(tab) {
            currentLeaderboardTab = tab;
            
            // Update tabs UI
            ['weekly', 'monthly', 'alltime'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-1 px-2 text-sm rounded-md transition-colors bg-nara-red text-white font-bold';
                } else {
                    btn.className = 'flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white';
                }
            });

            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            container.innerHTML = '';

            if (leaderboardData.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 text-sm">No data available</div>';
                return;
            }

            // Determine keys based on CSV headers (case-insensitive matching)
            const keys = Object.keys(leaderboardData[0]);
            const userKey = keys.find(k => k.toLowerCase().includes('user') || k.toLowerCase().includes('name')) || keys[0];
            const timeKey = keys.find(k => k.toLowerCase().includes(currentLeaderboardTab)) || keys[1];

            // Sort descending by time
            const sortedData = [...leaderboardData].sort((a, b) => {
                const valA = parseFloat(a[timeKey]) || 0;
                const valB = parseFloat(b[timeKey]) || 0;
                return valB - valA;
            }).slice(0, 10); // Top 10

            sortedData.forEach((row, index) => {
                const username = row[userKey];
                const timeVal = row[timeKey];
                
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 bg-gray-800/50 p-2 rounded hover:bg-gray-800 transition-colors';
                
                // Rank styling
                let rankClass = 'text-gray-400';
                if (index === 0) rankClass = 'text-yellow-400';
                if (index === 1) rankClass = 'text-gray-300';
                if (index === 2) rankClass = 'text-amber-600';

                item.innerHTML = `
                    <div class="font-bold w-6 text-center ${rankClass}">#${index + 1}</div>
                    <img src="https://minotar.net/avatar/${username}/32" alt="${username}" class="w-8 h-8 rounded bg-gray-700">
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium truncate text-white">${username}</div>
                        <div class="text-xs text-gray-400">${timeVal} hrs</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // --- Player Grid Logic ---

        async function fetchPlayers() {
            try {
                const response = await fetch('https://civapi.drekamor.dev/mc-sessions/last');
                const data = await response.json();
                
                // Process data
                allPlayers = data.sessions.map(session => {
                    let isOnline = !session.logoutTs;
                    const loginTime = session.loginTs;
                    const now = Date.now();
                    
                    // Calculate duration
                    let durationHours = 0;
                    let durationMinutes = 0;
                    
                    if (isOnline) {
                        const diff = now - loginTime;
                        durationHours = Math.floor(diff / (1000 * 60 * 60));
                        durationMinutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        
                        // Ignore > 24h (treat as offline/bugged session)
                        if (durationHours >= 24) {
                            isOnline = false;
                        }
                    }
                    
                    return {
                        username: session.mcName,
                        isOnline: isOnline,
                        loginTime: loginTime,
                        logoutTime: session.logoutTs || loginTime, // Fallback for sorting/display
                        durationHours: durationHours,
                        durationMinutes: durationMinutes
                    };
                });

                // Sort: Online first (longest duration first), then Offline (most recently seen first)
                allPlayers.sort((a, b) => {
                    if (a.isOnline && !b.isOnline) return -1;
                    if (!a.isOnline && b.isOnline) return 1;
                    
                    if (a.isOnline) {
                        // For online: smaller login timestamp = longer duration = show first
                        return a.loginTime - b.loginTime; 
                    } else {
                        // For offline: larger logout timestamp = more recent = show first
                        return b.logoutTime - a.logoutTime;
                    }
                });

                updateCounts();
                renderPlayers();
                
                // Start timer to update online durations
                setInterval(updateDurations, 60000); // Every minute

            } catch (error) {
                console.error('Player fetch error:', error);
                document.getElementById('player-grid').innerHTML = '<div class="col-span-full text-center text-red-400">Failed to load player data</div>';
            }
        }

        function updateCounts() {
            const online = allPlayers.filter(p => p.isOnline).length;
            document.getElementById('header-count').textContent = online;
        }

        function renderPlayers() {
            const grid = document.getElementById('player-grid');
            const searchTerm = document.getElementById('player-search').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = allPlayers.filter(p => p.username.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No players found</div>';
                return;
            }

            // Limit display for performance (first 100)
            const displayList = filtered.slice(0, 100);

            displayList.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card bg-gray-900 border border-gray-800 rounded-lg p-4 flex flex-col items-center gap-3 relative';
                
                const statusClass = player.isOnline ? 'status-online' : 'status-offline';
                const statusText = player.isOnline ? 'Online' : 'Offline';
                
                let timeDisplay = '';
                let tooltipTime = '';
                let iconName = '';
                let displayText = '';

                // Format options for local time with timezone (Handles DST automatically)
                const dateOptions = { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric', 
                    hour: 'numeric', 
                    minute: '2-digit',
                    timeZoneName: 'short' 
                };

                if (player.isOnline) {
                    iconName = 'clock';
                    displayText = `Online for <span class="duration-text" data-login="${player.loginTime}">${player.durationHours}h ${player.durationMinutes}m</span>`;
                    tooltipTime = new Date(player.loginTime).toLocaleString(undefined, dateOptions);
                } else {
                    iconName = 'log-out';
                    tooltipTime = new Date(player.logoutTime).toLocaleString(undefined, dateOptions);
                    
                    const now = Date.now();
                    const diffMs = now - player.logoutTime;
                    const diffSeconds = Math.floor(diffMs / 1000);
                    const diffMinutes = Math.floor(diffMs / (1000 * 60));
                    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    
                    if (diffSeconds < 60) {
                        displayText = `Offline for ${diffSeconds} seconds`;
                    } else if (diffMinutes < 60) {
                        displayText = `Offline for ${diffMinutes} minutes`;
                    } else if (diffHours < 24) {
                        displayText = `Offline for ${diffHours} hours`;
                    } else if (diffDays < 30) {
                        displayText = `Offline for ${diffDays} days`;
                    } else if (diffDays < 365) {
                        const diffMonths = Math.floor(diffDays / 30);
                        displayText = `Offline for ${diffMonths} months`;
                    } else {
                        const diffYears = Math.floor(diffDays / 365);
                        displayText = `Offline for ${diffYears} years`;
                    }
                }

                timeDisplay = `
                    <div class="relative group cursor-help flex items-center justify-center gap-2 text-sm text-gray-400 font-medium">
                        <i data-feather="${iconName}" class="w-4 h-4"></i>
                        <span>${displayText}</span>
                        <div class="time-tooltip">
                            ${tooltipTime}
                        </div>
                    </div>
                `;

                // Create image element programmatically to attach onload handler
                const imgContainer = document.createElement('div');
                imgContainer.className = 'relative';
                
                const img = document.createElement('img');
                img.src = `https://mc-heads.net/avatar/${player.username}/100`;
                img.alt = player.username;
                img.className = 'w-20 h-20 rounded-md shadow-lg bg-gray-800';
                img.crossOrigin = "Anonymous"; // Enable CORS for canvas reading
                
                // Hash check handler
                img.onload = function() {
                    if (badHashes.size > 0) {
                        try {
                            hashCtx.clearRect(0, 0, 32, 32);
                            hashCtx.drawImage(img, 0, 0, 32, 32);
                            const currentHash = hashCanvas.toDataURL();
                            

                            if (badHashes.has(currentHash)) {
                                // Found a bad image, swap to Minotar
                                img.onload = null; // Prevent recursion
                                img.src = `https://minotar.net/avatar/${player.username}/100`;
                            }
                        } catch (e) {
                            // CORS error or other issue, ignore
                            console.error("Hash check error", e);
                        }
                    }
                };

                const statusIndicator = document.createElement('div');
                statusIndicator.className = `${statusClass} status-indicator`;
                statusIndicator.title = statusText;

                imgContainer.appendChild(img);
                imgContainer.appendChild(statusIndicator);

                card.innerHTML = ''; // Clear previous content
                card.appendChild(imgContainer);
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'font-bold text-white text-lg truncate w-full text-center mt-2';
                nameDiv.title = player.username;
                nameDiv.textContent = player.username;
                card.appendChild(nameDiv);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'text-center w-full mt-1';
                timeDiv.innerHTML = timeDisplay;
                card.appendChild(timeDiv);
                
                grid.appendChild(card);
            });
            
            feather.replace();
        }

        function updateDurations() {
            const now = Date.now();
            document.querySelectorAll('.duration-text').forEach(el => {
                const loginTime = parseInt(el.dataset.login);
                if (loginTime) {
                    const diff = now - loginTime;
                    const h = Math.floor(diff / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    el.textContent = `Online for ${h}h ${m}m`;
                }
            });
        }

        // Search listener
        document.getElementById('player-search').addEventListener('input', (e) => {
            renderPlayers();
            updateURL(e.target.value);
        });

        function updateURL(searchTerm) {
            const url = new URL(window.location);
            if (searchTerm) {
                url.searchParams.set('search', searchTerm);
            } else {
                url.searchParams.delete('search');
            }
            window.history.replaceState({}, '', url);
        }

        function loadSearchFromURL() {
            const params = new URLSearchParams(window.location.search);
            const search = params.get('search');
            if (search) {
                document.getElementById('player-search').value = search;
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadSearchFromURL(); // Load search param first
            initBadHashes();
            loadLeaderboard();
            fetchPlayers();
        });

    </script>
</body>
</html>
