<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats | Nara</title>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://api.civinfo.net">
    <link rel="dns-prefetch" href="https://mc-heads.net">
    <link rel="dns-prefetch" href="https://minotar.net">
    <link rel="preconnect" href="https://api.civinfo.net" crossorigin>
    <link rel="preconnect" href="https://mc-heads.net" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
    <link rel="stylesheet" href="../style.css" fetchpriority="high">
    <style>
        .leaderboard-scroll::-webkit-scrollbar { width: 6px; }
        .leaderboard-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .leaderboard-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .leaderboard-scroll::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .player-card { transition: transform 0.2s, background-color 0.2s; }
        .player-card:hover { transform: translateY(-2px); background-color: #1f2937; }

        .status-indicator {
            position: absolute; bottom: -5px; right: -5px; width: 20px; height: 20px;
            border-radius: 50%; border: 4px solid #111827; z-index: 10;
        }
        .status-online { background-color: #10b981; }
        .status-offline { background-color: #ef4444; }

        .time-tooltip {
            visibility: hidden; opacity: 0; position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); margin-bottom: 8px; padding: 6px 12px;
            background: rgba(31, 41, 55, 0.95); border: 1px solid #374151; color: #f9fafb;
            font-size: 0.85rem; font-weight: 500; border-radius: 6px; white-space: nowrap; z-index: 99999;
            transition: opacity 0.2s; pointer-events: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }
        .group:hover .time-tooltip { visibility: visible; opacity: 1; }
    </style>

    <script src="../components/analytics.js" defer></script>
    <script src="../components/navbar.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>

    <div class="h-[100px]"></div>

    <main class="flex-grow py-10 px-4">
        <div class="max-w-[95%] mx-auto w-full flex flex-col lg:flex-row gap-8">
            <div class="w-full lg:w-1/5 flex flex-col gap-6 lg:sticky lg:top-24">
                <div class="bg-gray-900 rounded-lg border border-gray-800 p-4 h-fit">
                    <h2 class="text-2xl font-bold text-primary mb-4 flex items-center gap-2">
                        <i data-feather="bar-chart-2"></i> Leaderboard
                    </h2>

                    <div class="flex gap-2 mb-4 bg-gray-800 p-1 rounded-lg">
                        <button onclick="switchLeaderboard('weekly')" id="tab-weekly" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors bg-nara-red text-white font-bold">Weekly</button>
                        <button onclick="switchLeaderboard('monthly')" id="tab-monthly" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white">Monthly</button>
                        <button onclick="switchLeaderboard('alltime')" id="tab-alltime" class="flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white">All-Time</button>
                    </div>

                    <div id="leaderboard-list" class="space-y-3 leaderboard-scroll max-h-[60vh] overflow-y-auto pr-2">
                        <div class="text-center text-gray-500 py-4">Loading...</div>
                    </div>

                    <div class="mt-4 text-xs text-gray-500 text-center border-t border-gray-800 pt-3">
                        Updated daily at 12am UTC
                    </div>
                </div>

                <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 text-sm text-gray-300">
                    <p class="font-semibold text-white">Sources</p>
                    <p class="mt-2 leading-relaxed">Playtime stats are provided by <a href="https://api.civinfo.net" target="_blank" class="text-nara-red hover:underline">api.civinfo.net</a>. Please contact <span class="font-medium">Gjum</span> if you spot any data errors. Player heads are sourced from <a href="https://mc-heads.net" target="_blank" class="text-nara-red hover:underline">mc-heads.net</a> and <a href="https://minotar.net" target="_blank" class="text-nara-red hover:underline">minotar.net</a>.</p>
                    <p>Performance errors are likely my fault.</p>
                </div>
            </div>

            <div class="w-full lg:w-4/5">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h1 class="text-4xl font-bold text-primary flex items-center gap-3">
                        Online Players
                        <span class="text-gray-400 text-2xl flex items-center gap-2">
                            <i data-feather="users" class="w-6 h-6"></i> <span id="header-count">0</span>
                        </span>
                    </h1>

                    <div class="relative w-full md:w-[30%]">
                        <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="text" id="player-search" placeholder="Search players..."
                               class="w-full pl-10 pr-4 py-2 bg-gray-900 border border-gray-700 rounded-full text-white placeholder-gray-400 focus:outline-none focus:border-nara-red transition-colors">
                    </div>
                </div>

                <div id="player-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
                    <div class="col-span-full text-center py-12 text-gray-500">Loading player data...</div>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>
    <script src="../components/footer.js"></script>

    <script>
        let allPlayers = [];
        let leaderboardData = [];
        let currentLeaderboardTab = 'weekly';
        let durationIntervalId = null;
        const INITIAL_OFFLINE_LIMIT = 50;
        const OFFLINE_BATCH_SIZE = 30;
        const PREFETCH_AHEAD = 100;

        const cachedElements = {
            playerGrid: null,
            playerSearch: null,
            headerCount: null
        };

        let onlinePlayers = [];
        let offlinePlayers = [];
        let offlineIndex = 0;
        let avatarObserver = null;
        let loadMoreObserver = null;
        let searchTimeout = null;
        const prefetchedAvatars = new Set();
        const loadMoreSentinel = document.createElement('div');
        loadMoreSentinel.id = 'player-grid-sentinel';
        loadMoreSentinel.className = 'h-8 col-span-full';

        const pathSegments = window.location.pathname.split('/').filter(p => p);
        const statsIndex = pathSegments.indexOf('stats');
        const baseStatsPath = statsIndex === -1
            ? '/stats/'
            : '/' + pathSegments.slice(0, statsIndex + 1).join('/') + '/';

        const ICON_CLOCK = '<svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
        const ICON_LOGOUT = '<svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';

        const API_HEADERS = { 'X-Client-Source': 'nara.rocks/stats' };
        function fetchAPI(url) {
            return fetch(url, { headers: API_HEADERS });
        }

        function refreshIcons() {
            if (window.feather) feather.replace();
        }

        function openProfile(username) {
            if (!username) return;
            const userUrl = baseStatsPath + 'user/?player=' + encodeURIComponent(username);
            window.location.href = userUrl;
        }

        function ensureAvatarObserver() {
            if (!('IntersectionObserver' in window)) return null;
            if (!avatarObserver) {
                avatarObserver = new IntersectionObserver((entries) => {
                    for (let i = 0; i < entries.length; i++) {
                        const entry = entries[i];
                        if (!entry.isIntersecting) continue;
                        const img = entry.target;
                        avatarObserver.unobserve(img);
                        const username = img.dataset.username;
                        if (username) resolveAvatarUrl(username, img);
                    }
                }, { rootMargin: '500px' });
            }
            return avatarObserver;
        }

        function ensureLoadMoreObserver() {
            if (!('IntersectionObserver' in window)) return null;
            if (!loadMoreObserver) {
                loadMoreObserver = new IntersectionObserver((entries) => {
                    if (entries.some(entry => entry.isIntersecting)) {
                        loadMoreOfflinePlayers();
                    }
                }, { rootMargin: '200px' });
            }
            return loadMoreObserver;
        }

        function setupInfiniteScroll(grid) {
            const observer = ensureLoadMoreObserver();
            if (!observer) return;
            if (!grid.contains(loadMoreSentinel)) grid.appendChild(loadMoreSentinel);
            observer.observe(loadMoreSentinel);
        }

        function teardownInfiniteScroll() {
            if (loadMoreObserver) loadMoreObserver.disconnect();
            if (loadMoreSentinel.parentElement) {
                loadMoreSentinel.parentElement.removeChild(loadMoreSentinel);
            }
        }

        function appendPlayerCards(grid, players, isEager = false) {
            if (!players.length) return;
            const now = Date.now();
            const fragment = document.createDocumentFragment();
            const observer = isEager ? null : ensureAvatarObserver();
            const imagesToLoad = [];

            for (let i = 0; i < players.length; i++) {
                const player = players[i];
                const statusClass = player.isOnline ? 'status-online' : 'status-offline';
                const referenceTime = player.isOnline ? player.loginTime : player.logoutTime;
                const tooltipTime = referenceTime ? new Date(referenceTime).toLocaleString() : 'Unknown';

                let statusContent;
                if (player.isOnline) {
                    statusContent = `${ICON_CLOCK}<span>Online for <span class="duration-text" data-login="${player.loginTime}">${player.durationHours}h ${player.durationMinutes}m</span></span>`;
                } else {
                    const diffMs = referenceTime ? now - referenceTime : 0;
                    const diffDays = Math.floor(diffMs / 86400000);
                    statusContent = `${ICON_LOGOUT}<span>${diffDays < 1 ? 'Offline < 1 day' : `Offline for ${diffDays} days`}</span>`;
                }

                const card = document.createElement('div');
                card.className = 'player-card bg-gray-900 border border-gray-800 rounded-lg p-4 flex flex-col items-center gap-3 relative cursor-pointer';
                card.dataset.username = player.username;
                card.innerHTML = `<div class="relative"><img class="w-20 h-20 rounded-md shadow-lg bg-gray-800" alt="" data-username="${player.username}"><div class="${statusClass} status-indicator"></div></div><div class="font-bold text-white text-lg truncate w-full text-center mt-2">${player.username}</div><div class="text-center w-full mt-1"><div class="relative group cursor-help flex items-center justify-center gap-2 text-sm text-gray-400 font-medium">${statusContent}<div class="time-tooltip">${tooltipTime}</div></div></div>`;

                const img = card.querySelector('img');
                if (img) imagesToLoad.push({ img, username: player.username });

                fragment.appendChild(card);
            }

            const insertionPoint = loadMoreSentinel.parentElement === grid ? loadMoreSentinel : null;
            if (insertionPoint) grid.insertBefore(fragment, insertionPoint);
            else grid.appendChild(fragment);

            for (let i = 0; i < imagesToLoad.length; i++) {
                const { img, username } = imagesToLoad[i];
                if (isEager) resolveAvatarUrl(username, img, true);
                else if (observer) observer.observe(img);
                else resolveAvatarUrl(username, img);
            }
        }

        function resolveAvatarUrl(username, imgElement, isEager = false) {
            const primaryUrl = `https://mc-heads.net/avatar/${username}/32`;
            const fallbackUrl = `https://minotar.net/avatar/${username}/32`;

            imgElement.loading = isEager ? 'eager' : 'lazy';
            imgElement.decoding = 'async';

            imgElement.onerror = () => {
                if (imgElement.src !== fallbackUrl) {
                    imgElement.src = fallbackUrl;
                }
            };
            imgElement.src = primaryUrl;
        }

        function cacheAvatar(username) {
            if (!username || prefetchedAvatars.has(username)) return;
            prefetchedAvatars.add(username);
            const img = new Image();
            img.src = `https://mc-heads.net/avatar/${username}/32`;
        }

        function cacheUpcomingAvatars(startIndex) {
            const endIndex = Math.min(startIndex + PREFETCH_AHEAD, offlinePlayers.length);
            for (let i = startIndex; i < endIndex; i++) {
                cacheAvatar(offlinePlayers[i].username);
            }
        }

        function loadMoreOfflinePlayers() {
            if (offlineIndex >= offlinePlayers.length) {
                teardownInfiniteScroll();
                return;
            }
            const grid = cachedElements.playerGrid;
            if (!grid) return;
            const nextCount = Math.min(OFFLINE_BATCH_SIZE, offlinePlayers.length - offlineIndex);
            const nextBatch = offlinePlayers.slice(offlineIndex, offlineIndex + nextCount);
            offlineIndex += nextCount;
            appendPlayerCards(grid, nextBatch);
            cacheUpcomingAvatars(offlineIndex);

            if (offlineIndex >= offlinePlayers.length) teardownInfiniteScroll();
        }

        function processSessionData(data, playerMap, now) {
            const logins = data.loginTimestamps || [];
            const logouts = data.logoutTimestamps || [];
            const names = data.mcNames || [];

            for (let i = 0; i < logins.length; i++) {
                const username = names[i] || 'Unknown';
                const loginTime = logins[i];
                const logoutTime = logouts[i];

                if (!playerMap.has(username) || loginTime > playerMap.get(username).loginTime) {
                    let isOnline = logoutTime === null;
                    let durationHours = 0;
                    let durationMinutes = 0;

                    if (isOnline && loginTime) {
                        const diff = now - loginTime;
                        durationHours = Math.floor(diff / 3600000);
                        durationMinutes = Math.floor((diff % 3600000) / 60000);
                        if (durationHours >= 24) isOnline = false;
                    }

                    playerMap.set(username, {
                        username,
                        lowerName: username.toLowerCase(),
                        isOnline,
                        loginTime,
                        logoutTime: logoutTime || loginTime,
                        durationHours,
                        durationMinutes
                    });
                }
            }
        }

        function processAccountData(data, playerMap, now) {
            const names = data.mcNames || [];
            const lastLogins = data.lastLoginTimestamps || [];
            const lastLogouts = data.lastLogoutTimestamps || [];

            for (let i = 0; i < names.length; i++) {
                const username = names[i];
                if (!username) continue;

                const lastLogin = lastLogins[i] || 0;
                const lastLogout = lastLogouts[i] || 0;
                const existing = playerMap.get(username);

                if (existing) {
                    if (lastLogin > lastLogout && !existing.isOnline && lastLogin > existing.loginTime) {
                        const diff = now - lastLogin;
                        const durationHours = Math.floor(diff / 3600000);
                        const durationMinutes = Math.floor((diff % 3600000) / 60000);

                        if (durationHours < 24) {
                            existing.isOnline = true;
                            existing.loginTime = lastLogin;
                            existing.durationHours = durationHours;
                            existing.durationMinutes = durationMinutes;
                        }
                    }
                } else {
                    let isOnline = lastLogin > lastLogout;
                    let durationHours = 0;
                    let durationMinutes = 0;

                    if (isOnline && lastLogin) {
                        const diff = now - lastLogin;
                        durationHours = Math.floor(diff / 3600000);
                        durationMinutes = Math.floor((diff % 3600000) / 60000);
                        if (durationHours >= 24) isOnline = false;
                    }

                    playerMap.set(username, {
                        username,
                        lowerName: username.toLowerCase(),
                        isOnline,
                        loginTime: lastLogin,
                        logoutTime: lastLogout || lastLogin,
                        durationHours,
                        durationMinutes
                    });
                }
            }
        }

        async function fetchPlayers() {
            try {
                const now = Date.now();
                const oneDayAgo = now - (24 * 60 * 60 * 1000);
                const playerMap = new Map();

                const recentResponse = await fetchAPI(`https://api.civinfo.net/mc-sessions/all?after=${oneDayAgo}`);
                if (!recentResponse.ok) throw new Error('Failed to fetch recent players');
                const recentData = await recentResponse.json();
                if (!Array.isArray(recentData.loginTimestamps)) throw new Error('Invalid API response');
                processSessionData(recentData, playerMap, now);

                allPlayers = Array.from(playerMap.values());
                allPlayers.sort((a, b) => (a.isOnline === b.isOnline)
                    ? (a.isOnline ? a.loginTime - b.loginTime : b.logoutTime - a.logoutTime)
                    : (a.isOnline ? -1 : 1));
                cachedElements.headerCount.textContent = allPlayers.filter(p => p.isOnline).length;

                for (let i = 0; i < allPlayers.length && allPlayers[i].isOnline; i++) {
                    cacheAvatar(allPlayers[i].username);
                }

                renderPlayers();

                const allResponse = await fetchAPI('https://api.civinfo.net/mc-accounts/all?limit=50000');
                if (allResponse.ok) {
                    const allData = await allResponse.json();
                    if (Array.isArray(allData.mcNames)) {
                        processAccountData(allData, playerMap, now);
                        allPlayers = Array.from(playerMap.values());
                        allPlayers.sort((a, b) => (a.isOnline === b.isOnline)
                            ? (a.isOnline ? a.loginTime - b.loginTime : b.logoutTime - a.logoutTime)
                            : (a.isOnline ? -1 : 1));
                        cachedElements.headerCount.textContent = allPlayers.filter(p => p.isOnline).length;
                        renderPlayers();
                    }
                }

                const hasOnline = allPlayers.some(p => p.isOnline);
                if (hasOnline && durationIntervalId === null) {
                    durationIntervalId = setInterval(updateDurations, 60000);
                } else if (!hasOnline && durationIntervalId !== null) {
                    clearInterval(durationIntervalId);
                    durationIntervalId = null;
                }
            } catch (error) {
                console.error(error);
                cachedElements.playerGrid.innerHTML = '<div class="col-span-full text-center text-red-400">Failed to load player data</div>';
            }
        }

        function renderPlayers() {
            const grid = cachedElements.playerGrid;
            const searchTerm = cachedElements.playerSearch.value.trim().toLowerCase();

            if (!allPlayers || !Array.isArray(allPlayers)) {
                grid.innerHTML = '<div class="col-span-full text-center text-red-400 py-8">Player data unavailable</div>';
                return;
            }
            if (allPlayers.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">Loading player data...</div>';
                return;
            }

            onlinePlayers = [];
            offlinePlayers = [];

            if (searchTerm) {
                for (let i = 0; i < allPlayers.length; i++) {
                    const player = allPlayers[i];
                    if (player.lowerName && player.lowerName.includes(searchTerm)) {
                        if (player.isOnline) onlinePlayers.push(player);
                        else offlinePlayers.push(player);
                    }
                }
            } else {
                for (let i = 0; i < allPlayers.length; i++) {
                    const player = allPlayers[i];
                    if (player.isOnline) onlinePlayers.push(player);
                    else offlinePlayers.push(player);
                }
            }

            offlineIndex = 0;

            if (onlinePlayers.length === 0 && offlinePlayers.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No players found</div>';
                teardownInfiniteScroll();
                return;
            }

            teardownInfiniteScroll();
            grid.innerHTML = '';

            if (onlinePlayers.length > 0) appendPlayerCards(grid, onlinePlayers, true);

            const maxInitialCards = searchTerm ? Number.POSITIVE_INFINITY : INITIAL_OFFLINE_LIMIT;
            const availableOfflineSlots = Math.max(0, maxInitialCards - onlinePlayers.length);
            const initialOfflineCount = Math.min(availableOfflineSlots, offlinePlayers.length);

            if (initialOfflineCount > 0) {
                let rendered = 0;
                const CHUNK_SIZE = 20;

                function renderOfflineChunk() {
                    if (rendered >= initialOfflineCount) {
                        offlineIndex = initialOfflineCount;
                        if (!searchTerm && offlinePlayers.length > offlineIndex) {
                            setupInfiniteScroll(grid);
                            cacheUpcomingAvatars(offlineIndex);
                        }
                        return;
                    }

                    const end = Math.min(rendered + CHUNK_SIZE, initialOfflineCount);
                    const chunk = offlinePlayers.slice(rendered, end);
                    appendPlayerCards(grid, chunk);
                    rendered = end;
                    requestAnimationFrame(renderOfflineChunk);
                }

                requestAnimationFrame(renderOfflineChunk);
            } else if (!searchTerm && offlinePlayers.length > 0) {
                setupInfiniteScroll(grid);
                cacheUpcomingAvatars(0);
            }
        }

        function updateDurations() {
            const now = Date.now();
            document.querySelectorAll('.duration-text').forEach(el => {
                const loginTime = parseInt(el.dataset.login, 10);
                if (loginTime) {
                    const diff = now - loginTime;
                    const hours = Math.floor(diff / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    el.textContent = `${hours}h ${minutes}m`;
                }
            });
        }

        function updateSearchURL(searchTerm) {
            const url = new URL(window.location);
            if (searchTerm) url.searchParams.set('search', searchTerm);
            else url.searchParams.delete('search');
            window.history.replaceState({}, '', url);
        }

        function debouncedRenderPlayers(searchValue) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderPlayers();
                updateSearchURL(searchValue);
            }, 200);
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch('../data/leaderboard.csv');
                if (!response.ok) throw new Error('Failed');
                const csvText = await response.text();
                const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
                leaderboardData = results.data;
                renderLeaderboard();
            } catch (error) {
                document.getElementById('leaderboard-list').innerHTML = '<div class="text-center text-gray-500 text-sm py-4">Unavailable</div>';
            }
        }

        function switchLeaderboard(tab) {
            currentLeaderboardTab = tab;
            ['weekly', 'monthly', 'alltime'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab
                    ? 'flex-1 py-1 px-2 text-sm rounded-md transition-colors bg-nara-red text-white font-bold'
                    : 'flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white';
            });
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            container.innerHTML = '';
            if (leaderboardData.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 text-sm">No data</div>';
                return;
            }

            const keys = Object.keys(leaderboardData[0]);
            const userKey = keys.find(k => k.toLowerCase().includes('user') || k.toLowerCase().includes('name')) || keys[0];
            const timeKey = keys.find(k => k.toLowerCase().includes(currentLeaderboardTab)) || keys[1];
            const sortedData = [...leaderboardData]
                .sort((a, b) => (parseFloat(b[timeKey]) || 0) - (parseFloat(a[timeKey]) || 0))
                .slice(0, 10);

            sortedData.forEach((row, index) => {
                const username = row[userKey];
                const timeVal = row[timeKey];
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 bg-gray-800/50 p-2 rounded hover:bg-gray-800 transition-colors cursor-pointer';
                item.onclick = () => openProfile(username);
                const rankClass = index === 0 ? 'text-yellow-400' : index === 1 ? 'text-gray-300' : index === 2 ? 'text-amber-600' : 'text-gray-400';
                item.innerHTML = `<div class="font-bold w-6 text-center ${rankClass}">#${index + 1}</div><img src="https://minotar.net/avatar/${username}/32" class="w-8 h-8 rounded bg-gray-700"><div class="flex-1 min-w-0"><div class="text-sm font-medium truncate text-white">${username}</div><div class="text-xs text-gray-400">${timeVal} hrs</div></div>`;
                container.appendChild(item);
            });
        }

        function handleRouting() {
            const params = new URLSearchParams(window.location.search);
            const player = params.get('player');
            if (player) {
                openProfile(player);
                return;
            }
            const search = params.get('search') || '';
            cachedElements.playerSearch.value = search;
            renderPlayers();
        }

        document.addEventListener('DOMContentLoaded', () => {
            cachedElements.playerGrid = document.getElementById('player-grid');
            cachedElements.playerSearch = document.getElementById('player-search');
            cachedElements.headerCount = document.getElementById('header-count');

            handleRouting();

            cachedElements.playerSearch.addEventListener('input', (e) => {
                debouncedRenderPlayers(e.target.value.trim());
            });

            cachedElements.playerGrid.addEventListener('click', (event) => {
                const card = event.target.closest('.player-card');
                if (!card) return;
                openProfile(card.dataset.username);
            });

            loadLeaderboard();
            fetchPlayers();
            refreshIcons();
        });

        window.addEventListener('popstate', handleRouting);
    </script>
</body>
</html>
