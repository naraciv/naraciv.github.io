    <style>
        /* Custom scrollbar for leaderboard */
        .leaderboard-scroll::-webkit-scrollbar { width: 6px; }
        .leaderboard-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .leaderboard-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .leaderboard-scroll::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .player-card { transition: transform 0.2s, background-color 0.2s; }
        .player-card:hover { transform: translateY(-2px); background-color: #1f2937; }
        
        .status-indicator {
            position: absolute; bottom: -5px; right: -5px; width: 20px; height: 20px;
            border-radius: 50%; border: 4px solid #111827; z-index: 10;
        }
        .status-online { background-color: #10b981; }
        .status-offline { background-color: #ef4444; }

        .time-tooltip {
            visibility: hidden; opacity: 0; position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); margin-bottom: 8px; padding: 6px 10px;
            background-color: #1f2937; border: 1px solid #374151; color: #fff;
            font-size: 0.75rem; border-radius: 4px; white-space: nowrap; z-index: 20;
            transition: opacity 0.2s; pointer-events: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .group:hover .time-tooltip { visibility: visible; opacity: 1; }

        /* Calendar Styles */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .calendar-day { aspect-ratio: 1; border-radius: 2px; cursor: pointer; }
        
        #calendar-tooltip {
            display: none; position: absolute; background-color: #1f2937; border: 1px solid #374151;
            color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;
            pointer-events: none; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* D3 Chart Styles */
        .chart-container text { fill: #9ca3af; font-size: 12px; font-family: sans-serif; }
        .chart-container path, .chart-container line { stroke: #374151; }
        .line-path { fill: none; stroke: #ef4444; stroke-width: 2px; }
        .bar-rect { fill: #ef4444; }
        .brush .selection { fill: #ef4444; fill-opacity: 0.3; stroke: #ef4444; stroke-width: 1px; }
        .brush .handle { fill: #ef4444; width: 6px; }
        
        /* Invisible overlay for capturing mouse events on line chart */
        .overlay { fill: none; pointer-events: all; }

        /* D3 Tooltip */
        #d3-tooltip {
            position: absolute; opacity: 0; background: #1f2937; border: 1px solid #374151;
            color: white; padding: 8px; border-radius: 4px; pointer-events: none; font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 50;
        }
    </style>
</head>

    <script>
        // --- Global State ---
        let allPlayers = [];
        let leaderboardData = [];
        let currentLeaderboardTab = 'weekly';
        let profileData = null;
        let skinViewer = null;
        let currentChartType = 'calendar';
        let currentGranularity = 'weekly'; 
        
        const SERVER_START_DATE = 1654041600000; 
        const ONE_MONTH_MS = 30 * 24 * 60 * 60 * 1000;
        const MAX_SESSION_MS = 23.8 * 60 * 60 * 1000; 
        const MAX_DATALABELS_RANGE = 14 * 24 * 60 * 60 * 1000;

        // Image Hashing
        const badHashes = new Set();
        const hashCanvas = document.createElement('canvas');
        hashCanvas.width = 32; hashCanvas.height = 32;
        const hashCtx = hashCanvas.getContext('2d', { willReadFrequently: true });

        document.addEventListener('DOMContentLoaded', () => {
            initBadHashes();
            handleRouting();
            
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('settings-menu');
                const btn = document.getElementById('settings-btn');
                if (!menu.contains(e.target) && !btn.contains(e.target)) menu.classList.add('hidden');
            });
            document.getElementById('settings-btn').addEventListener('click', () => {
                document.getElementById('settings-menu').classList.toggle('hidden');
            });
            document.getElementById('player-search').addEventListener('input', (e) => {
                renderPlayers();
                updateURL(e.target.value, null);
            });
        });

        window.addEventListener('popstate', handleRouting);
        window.addEventListener('resize', () => {
            if (currentChartType !== 'calendar' && profileData) {
                renderD3Chart(currentChartType);
            }
        });

        function handleRouting() {
            const params = new URLSearchParams(window.location.search);
            let player = params.get('player');
            const search = params.get('search');
            const pathParts = window.location.pathname.split('/').filter(p => p);
            const lastSegment = pathParts[pathParts.length - 1];
            if (lastSegment && lastSegment !== 'stats' && lastSegment !== 'index.html') player = lastSegment;

            if (player) showProfileView(player);
            else showListView(search);
        }

        function goBackToList() {
            const url = new URL(window.location);
            url.searchParams.delete('player');
            if (window.location.pathname.split('/').length > 2) window.history.pushState({}, '', '../stats/');
            else window.history.pushState({}, '', url.pathname + url.search);
            showListView();
        }

        function showListView(searchTerm) {
            document.getElementById('view-list').classList.remove('hidden');
            document.getElementById('view-profile').classList.add('hidden');
            if (searchTerm) document.getElementById('player-search').value = searchTerm;
            if (allPlayers.length === 0) { loadLeaderboard(); fetchPlayers(); }
            else renderPlayers();
            feather.replace();
            if (skinViewer) { skinViewer.dispose(); skinViewer = null; }
        }

        async function showProfileView(username) {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-profile').classList.remove('hidden');
            document.getElementById('profile-username').textContent = username;
            document.getElementById('profile-playtime').textContent = 'Loading...';
            document.getElementById('chart-calendar').innerHTML = '<div class="text-center py-20 text-gray-500">Loading history...</div>';
            document.getElementById('monthly-data-container').innerHTML = '';
            
            if (skinViewer) skinViewer.dispose();
            const canvas = document.getElementById("skin-canvas");
            skinViewer = new skinview3d.SkinViewer({ canvas: canvas, width: 250, height: 350, skin: `https://mc-heads.net/skin/${username}` });
            skinViewer.controls.enableZoom = true; skinViewer.controls.enableRotate = true;
            skinViewer.animation = new skinview3d.WalkingAnimation(); skinViewer.animation.speed = 0.5;
            document.getElementById('profile-namemc').href = `https://namemc.com/profile/${username}`;

            try {
                const response = await fetch(`https://civapi.duckdns.org/mc-sessions/all?mcName=${username}&mcServer=civmc`);
                if (!response.ok) throw new Error('Failed to fetch history');
                const data = await response.json();
                processProfileData(data);
            } catch (error) {
                console.error(error);
                document.getElementById('chart-calendar').innerHTML = '<div class="text-center py-20 text-red-500">Failed to load player history.</div>';
            }
            feather.replace();
        }

        // --- Image Handling ---
        async function computeImageHash(src) {
            return new Promise((resolve) => {
                const img = new Image(); img.crossOrigin = "Anonymous";
                img.onload = () => { hashCtx.clearRect(0, 0, 32, 32); hashCtx.drawImage(img, 0, 0, 32, 32); resolve(hashCanvas.toDataURL()); };
                img.onerror = () => resolve(null); img.src = src;
            });
        }
        async function initBadHashes() {
            const sources = ['../static/black.png', '../static/steve.png']; 
            for (const src of sources) { const hash = await computeImageHash(src); if (hash) badHashes.add(hash); }
        }
        function resolveAvatarUrl(username, imgElement) {
            const primaryUrl = `https://mc-heads.net/avatar/${username}/100`;
            const fallbackUrl = `https://minotar.net/avatar/${username}/100`;
            imgElement.src = primaryUrl; imgElement.crossOrigin = "Anonymous";
            imgElement.onload = function() {
                if (badHashes.size > 0) {
                    try {
                        hashCtx.clearRect(0, 0, 32, 32); hashCtx.drawImage(imgElement, 0, 0, 32, 32);
                        if (badHashes.has(hashCanvas.toDataURL())) { imgElement.onload = null; imgElement.src = fallbackUrl; }
                    } catch (e) {}
                }
            };
        }

        // --- Profile Logic ---
        function processProfileData(data) {
            const logins = data.loginTimestamps || [];
            const logouts = data.logoutTimestamps || [];
            const now = Date.now();
            let totalMs = 0; let firstJoin = now; let lastJoin = 0;
            const dailyPlaytime = {}; const monthlyPlaytime = {};

            for (let i = 0; i < logins.length; i++) {
                const login = logins[i];
                let logout = (i < logouts.length) ? logouts[i] : now;
                
                // Strict check against server start
                if (logout < SERVER_START_DATE) continue;
                
                if(login<SERVER_START_DATE) continue;


                if (logout < login) logout = now;
                
                // Cap session length to prevent massive outliers
                if (logout - login > MAX_SESSION_MS) logout = login + MAX_SESSION_MS;
                
                if (login < firstJoin) firstJoin = login;
                if (login > lastJoin) lastJoin = login;
                const duration = logout - login ;
                totalMs += duration;
                
                // Use UTC for bucketing to avoid timezone shifts (e.g. May 31st issue)
                const d = new Date(login);
                const dayStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
                
                dailyPlaytime[dayStart] = (dailyPlaytime[dayStart] || 0) + duration;
                
                // Monthly bucket (UTC)
                const monthKey = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
                monthlyPlaytime[monthKey] = (monthlyPlaytime[monthKey] || 0) + duration;
            }
            if (totalMs === 0) { firstJoin = 0; lastJoin = 0; }

            // Prepare D3 Data
            const dailyData = [];
            Object.keys(dailyPlaytime).sort((a,b)=>a-b).forEach(ts => {
                // Cap daily playtime at 24h to prevent graph artifacts
                const hours = Math.min(24, dailyPlaytime[ts] / 3600000);
                dailyData.push({ date: new Date(parseInt(ts)), value: hours });
            });

            const weeklyMap = {};
            Object.keys(dailyPlaytime).forEach(ts => {
                const d = new Date(parseInt(ts));
                // Get Monday (UTC)
                const day = d.getUTCDay(), diff = d.getUTCDate() - day + (day == 0 ? -6:1); 
                const monday = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), diff));
                // Ensure we don't go before server start for the bin
                const validMonday = Math.max(monday.getTime(), SERVER_START_DATE); 
                weeklyMap[validMonday] = (weeklyMap[validMonday] || 0) + dailyPlaytime[ts];
            });
            const weeklyData = [];
            Object.keys(weeklyMap).sort((a,b)=>a-b).forEach(ts => {
                weeklyData.push({ date: new Date(parseInt(ts)), value: weeklyMap[ts] / 3600000 });
            });

            profileData = { totalMs, firstJoin, lastJoin, dailyPlaytime, monthlyPlaytime, dailyData, weeklyData };
            
            document.getElementById('profile-playtime').textContent = (totalMs / 3600000).toFixed(1) + 'h';
            const dateOpts = { year: 'numeric', month: 'long', day: 'numeric' };
            if (firstJoin > 0) {
                document.getElementById('profile-first-join').textContent = new Date(firstJoin).toLocaleDateString(undefined, dateOpts);
                document.getElementById('profile-last-join').textContent = new Date(lastJoin).toLocaleDateString(undefined, dateOpts);
            } else {
                document.getElementById('profile-first-join').textContent = "N/A";
                document.getElementById('profile-last-join').textContent = "N/A";
            }
            renderMonthlyList();
            switchChart('calendar');
        }

        function renderMonthlyList() {
            const container = document.getElementById('monthly-data-container');
            container.innerHTML = '';
            if (profileData.firstJoin === 0) return;
            const start = new Date(profileData.firstJoin); const end = new Date();
            let current = new Date(start.getFullYear(), start.getMonth(), 1);
            let monthBuffer = [];
            while (current <= end) {
                const year = current.getFullYear(); const month = current.getMonth() + 1;
                const key = `${year}-${String(month).padStart(2, '0')}`;
                const ms = profileData.monthlyPlaytime[key] || 0;
                const hours = (ms / 3600000).toFixed(1);
                const monthName = current.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
                monthBuffer.push(`<div class="flex justify-between text-sm"><span class="text-gray-400">${monthName}:</span> <span class="font-mono text-white">${hours}h</span></div>`);
                if (monthBuffer.length === 6) {
                    const col = document.createElement('div'); col.className = 'flex flex-col gap-1 min-w-[160px]';
                    col.innerHTML = monthBuffer.join(''); container.appendChild(col); monthBuffer = [];
                }
                current.setMonth(current.getMonth() + 1);
            }
            if (monthBuffer.length > 0) {
                const col = document.createElement('div'); col.className = 'flex flex-col gap-1 min-w-[160px]';
                col.innerHTML = monthBuffer.join(''); container.appendChild(col);
            }
        }

        // --- D3 Charting Logic ---
        function switchChart(type) {
            currentChartType = type;
            ['calendar', 'line', 'bar'].forEach(t => {
                const btn = document.getElementById(`chart-tab-${t}`);
                btn.className = t === type ? 'px-4 py-1.5 text-sm rounded-md transition-colors bg-nara-red text-white font-bold' : 'px-4 py-1.5 text-sm rounded-md transition-colors text-gray-400 hover:text-white';
            });

            const calDiv = document.getElementById('chart-calendar');
            const mainDiv = document.getElementById('chart-d3-main');
            const brushDiv = document.getElementById('chart-d3-brush');
            const hint = document.getElementById('chart-hint-zoom');

            if (type === 'calendar') {
                calDiv.classList.remove('hidden'); mainDiv.classList.add('hidden'); brushDiv.classList.add('hidden'); hint.classList.add('hidden');
                renderCalendarChart();
            } else {
                calDiv.classList.add('hidden'); mainDiv.classList.remove('hidden'); brushDiv.classList.remove('hidden'); hint.classList.remove('hidden');
                renderD3Chart(type);
            }
        }

        function renderCalendarChart() {
            const container = document.getElementById('chart-calendar');
            container.innerHTML = '';
            const months = {};
            Object.entries(profileData.dailyPlaytime).forEach(([ts, ms]) => {
                const d = new Date(parseInt(ts));
                const key = `${d.getFullYear()}-${d.getMonth()}`;
                if (!months[key]) months[key] = { name: d.toLocaleDateString(undefined, {month:'long', year:'numeric'}), days: {}, max: 0 };
                const day = d.getDate();
                months[key].days[day] = ms;
                if (ms > months[key].max) months[key].max = ms;
            });
            const sortedKeys = Object.keys(months).sort((a,b) => {
                const [y1, m1] = a.split('-'); const [y2, m2] = b.split('-');
                return (parseInt(y1)*12 + parseInt(m1)) - (parseInt(y2)*12 + parseInt(m2));
            });
            
            // Made grid much denser for smaller calendars
            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 2xl:grid-cols-8 gap-2';
            
            sortedKeys.forEach(key => {
                const mData = months[key];
                const [y, m] = key.split('-').map(Number);
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const firstDayOffset = new Date(y, m, 1).getDay();
                
                const monthCard = document.createElement('div');
                // Reduced padding
                monthCard.className = 'bg-gray-800/30 p-1 rounded-lg';
                
                // Smaller font for title
                let html = `<h4 class="text-xs font-bold text-gray-400 mb-1 text-center truncate">${mData.name}</h4><div class="calendar-grid">`;
                for(let i=0; i<firstDayOffset; i++) html += `<div></div>`;
                for(let d=1; d<=daysInMonth; d++) {
                    const ms = mData.days[d] || 0;
                    const hours = (ms / 3600000).toFixed(1);
                    let opacity = 0.1;
                    if (mData.max > 0) opacity = 0.2 + (0.8 * (ms / mData.max));
                    const bg = ms > 0 ? `rgba(16, 185, 129, ${opacity})` : 'rgba(55, 65, 81, 0.3)';
                    
                    // Fix: Month Day, Year format
                    const dateObj = new Date(y, m, d);
                    const dateStr = dateObj.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
                    const title = `${dateStr}: ${hours}h`;
                    
                    html += `<div class="calendar-day" style="background-color: ${bg}" onmouseenter="showTooltip(event, '${title}')" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()"></div>`;
                }
                html += `</div>`;
                monthCard.innerHTML = html;
                gridWrapper.appendChild(monthCard);
            });
            container.appendChild(gridWrapper);
        }

        // --- D3 Main Chart Implementation ---
        function renderD3Chart(type) {
            const mainContainer = document.getElementById('chart-d3-main');
            const brushContainer = document.getElementById('chart-d3-brush');
            mainContainer.innerHTML = ''; brushContainer.innerHTML = '';

            const margin = { top: 20, right: 20, bottom: 30, left: 40 };
            const width = mainContainer.clientWidth - margin.left - margin.right;
            const height = 350 - margin.top - margin.bottom;
            const brushHeight = 60 - 20;

            // Determine initial granularity
            const totalRange = Date.now() - profileData.firstJoin;
            currentGranularity = totalRange < ONE_MONTH_MS ? 'daily' : 'weekly';
            let data = currentGranularity === 'daily' ? profileData.dailyData : profileData.weeklyData;

            // Scales - Use UTC to prevent local timezone shifts
            const x = d3.scaleUtc().range([0, width]);
            const y = d3.scaleLinear().range([height, 0]);
            const xBrush = d3.scaleUtc().range([0, width]);
            const yBrush = d3.scaleLinear().range([brushHeight, 0]);

            // Domains
            const xDomain = [new Date(profileData.firstJoin), new Date()];
            x.domain(xDomain);
            y.domain([0, d3.max(data, d => d.value) * 1.1]);
            xBrush.domain(xDomain);
            yBrush.domain(y.domain());

            // Main SVG
            const svg = d3.select("#chart-d3-main").append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // Axes
            const xAxis = svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
            const yAxis = svg.append("g").call(d3.axisLeft(y).ticks(5).tickFormat(d => d + "h"));

            // Clip Path
            svg.append("defs").append("clipPath").attr("id", "clip")
                .append("rect").attr("width", width).attr("height", height);

            const chartArea = svg.append("g").attr("clip-path", "url(#clip)");

            // Render Function
            function drawChart(chartData, chartType) {
                chartArea.selectAll("*").remove();
                
                if (chartType === 'line') {
                    // MonotoneX smooths the line, but the tooltip below snaps to real data
                    const line = d3.line().x(d => x(d.date)).y(d => y(d.value)).curve(d3.curveMonotoneX);
                    chartArea.append("path").datum(chartData).attr("class", "line-path").attr("d", line);
                    
                    // Dots
                    if (currentGranularity === 'daily' && (x.domain()[1] - x.domain()[0]) < MAX_DATALABELS_RANGE) {
                        chartArea.selectAll(".dot").data(chartData).enter().append("circle")
                            .attr("cx", d => x(d.date)).attr("cy", d => y(d.value)).attr("r", 3).attr("fill", "#ef4444");
                    }

                    // Invisible overlay for hover detection on Line Chart
                    chartArea.append("rect")
                        .attr("class", "overlay")
                        .attr("width", width)
                        .attr("height", height)
                        .on("mousemove", (event) => {
                            // Bisector finds the index of the specific date in the data array
                            const bisect = d3.bisector(d => d.date).left;
                            const x0 = x.invert(d3.pointer(event)[0]);
                            const i = bisect(chartData, x0, 1);
                            const d0 = chartData[i - 1];
                            const d1 = chartData[i];
                            // Snap to nearest actual data point
                            const d = (d0 && d1) ? (x0 - d0.date > d1.date - x0 ? d1 : d0) : (d0 || d1);
                            if (d) showD3Tooltip(event, d);
                        })
                        .on("mouseout", hideD3Tooltip);

                } else {
                    // Calculate bar width based on time interval (Daily vs Weekly)
                    // This ensures bars resize correctly when zooming
                    const intervalMs = currentGranularity === 'daily' ? 86400000 : 604800000;
                    
                    // Calculate pixel width of one interval at current zoom level
                    const t0 = x.domain()[0];
                    const t1 = new Date(t0.getTime() + intervalMs);
                    const barWidthRaw = x(t1) - x(t0);
                    // Ensure at least 1px width, subtract 1px for gap
                    const barWidth = Math.max(1, barWidthRaw - 1);

                    chartArea.selectAll(".bar-rect").data(chartData).enter().append("rect")
                        .attr("class", "bar-rect")
                        .attr("x", d => x(d.date))
                        .attr("y", d => y(d.value))
                        .attr("width", barWidth)
                        .attr("height", d => height - y(d.value))
                        .on("mouseover", (e, d) => showD3Tooltip(e, d))
                        .on("mouseout", hideD3Tooltip);
                }
            }

            drawChart(data, type);

            // --- Brush Chart ---
            const svgBrush = d3.select("#chart-d3-brush").append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", brushHeight + 20)
                .append("g")
                .attr("transform", `translate(${margin.left},0)`);

            // Brush Area (Gray background)
            svgBrush.append("rect").attr("width", width).attr("height", brushHeight).attr("fill", "#1f2937");

            // Brush Logic
            const brush = d3.brushX()
                .extent([[0, 0], [width, brushHeight]])
                .on("brush end", brushed);

            const brushG = svgBrush.append("g").attr("class", "brush").call(brush);
            
            // Set initial brush selection to full range
            brushG.call(brush.move, x.range());

            function brushed(event) {
                const selection = event.selection;
                if (!selection) return;
                
                const [minX, maxX] = selection.map(xBrush.invert);
                x.domain([minX, maxX]);
                
                // Update Granularity
                const range = maxX - minX;
                const newGranularity = range < ONE_MONTH_MS ? 'daily' : 'weekly';
                
                if (newGranularity !== currentGranularity) {
                    currentGranularity = newGranularity;
                    data = currentGranularity === 'daily' ? profileData.dailyData : profileData.weeklyData;
                    y.domain([0, d3.max(data, d => d.value) * 1.1]);
                    yAxis.call(d3.axisLeft(y).ticks(5).tickFormat(d => d + "h"));
                }

                // Filter data for view
                const viewData = data.filter(d => d.date >= minX && d.date <= maxX);
                
                xAxis.call(d3.axisBottom(x));
                drawChart(viewData, type);
            }
        }

        // D3 Tooltip
        function showD3Tooltip(event, d) {
            const tooltip = document.getElementById('d3-tooltip');
            let dateStr = '';
            
            // Use UTC formatting to match the axis
            const utcOpts = { month: 'short', day: 'numeric', timeZone: 'UTC' };
            const utcYearOpts = { year: 'numeric', timeZone: 'UTC' };

            if (currentGranularity === 'weekly') {
                const start = new Date(d.date);
                const end = new Date(d.date.getTime() + (6 * 24 * 60 * 60 * 1000));
                // "Jun 1 - Jun 7, 2022"
                dateStr = `${start.toLocaleDateString(undefined, utcOpts)} - ${end.toLocaleDateString(undefined, utcOpts)}, ${end.toLocaleDateString(undefined, utcYearOpts)}`;
            } else {
                dateStr = d.date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
            }

            tooltip.innerHTML = `<strong>${dateStr}</strong><br>${d.value.toFixed(2)} hours`;
            tooltip.style.opacity = 1;
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY - 20) + 'px';
        }
        function hideD3Tooltip() {
            document.getElementById('d3-tooltip').style.opacity = 0;
        }

        // Calendar Tooltip
        function showTooltip(e, text) {
            const el = document.getElementById('calendar-tooltip');
            el.textContent = text; el.style.display = 'block'; moveTooltip(e);
        }
        function moveTooltip(e) {
            const el = document.getElementById('calendar-tooltip');
            el.style.left = (e.pageX + 10) + 'px'; el.style.top = (e.pageY + 10) + 'px';
        }
        function hideTooltip() { document.getElementById('calendar-tooltip').style.display = 'none'; }

        function setFontSize(sizeClass) {
            const container = document.getElementById('view-profile');
            container.classList.remove('text-sm', 'text-base', 'text-lg');
            container.classList.add(sizeClass);
            document.getElementById('settings-menu').classList.add('hidden');
        }

        // --- Leaderboard & List (Same as before) ---
        async function loadLeaderboard() {
            try {
                const response = await fetch('../data/leaderboard.csv');
                if (!response.ok) throw new Error('Failed');
                const csvText = await response.text();
                const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
                leaderboardData = results.data;
                renderLeaderboard();
            } catch (error) { document.getElementById('leaderboard-list').innerHTML = '<div class="text-center text-gray-500 text-sm py-4">Unavailable</div>'; }
        }
        function switchLeaderboard(tab) {
            currentLeaderboardTab = tab;
            ['weekly', 'monthly', 'alltime'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? 'flex-1 py-1 px-2 text-sm rounded-md transition-colors bg-nara-red text-white font-bold' : 'flex-1 py-1 px-2 text-sm rounded-md transition-colors text-gray-400 hover:text-white';
            });
            renderLeaderboard();
        }
        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-list'); container.innerHTML = '';
            if (leaderboardData.length === 0) { container.innerHTML = '<div class="text-center text-gray-500 text-sm">No data</div>'; return; }
            const keys = Object.keys(leaderboardData[0]);
            const userKey = keys.find(k => k.toLowerCase().includes('user') || k.toLowerCase().includes('name')) || keys[0];
            const timeKey = keys.find(k => k.toLowerCase().includes(currentLeaderboardTab)) || keys[1];
            const sortedData = [...leaderboardData].sort((a, b) => (parseFloat(b[timeKey])||0) - (parseFloat(a[timeKey])||0)).slice(0, 10);
            sortedData.forEach((row, index) => {
                const username = row[userKey]; const timeVal = row[timeKey];
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 bg-gray-800/50 p-2 rounded hover:bg-gray-800 transition-colors cursor-pointer';
                item.onclick = () => { updateURL(null, username); showProfileView(username); };
                let rankClass = index === 0 ? 'text-yellow-400' : index === 1 ? 'text-gray-300' : index === 2 ? 'text-amber-600' : 'text-gray-400';
                item.innerHTML = `<div class="font-bold w-6 text-center ${rankClass}">#${index + 1}</div><img src="https://minotar.net/avatar/${username}/32" class="w-8 h-8 rounded bg-gray-700"><div class="flex-1 min-w-0"><div class="text-sm font-medium truncate text-white">${username}</div><div class="text-xs text-gray-400">${timeVal} hrs</div></div>`;
                container.appendChild(item);
            });
        }
        async function fetchPlayers() {
            try {
                const response = await fetch('https://civapi.drekamor.dev/mc-sessions/last');
                const data = await response.json();
                allPlayers = data.sessions.map(session => {
                    let isOnline = !session.logoutTs; const loginTime = session.loginTs; const now = Date.now();
                    let durationHours = 0; let durationMinutes = 0;
                    if (isOnline) {
                        const diff = now - loginTime; durationHours = Math.floor(diff / 3600000); durationMinutes = Math.floor((diff % 3600000) / 60000);
                        if (durationHours >= 24) isOnline = false;
                    }
                    return { username: session.mcName, isOnline, loginTime, logoutTime: session.logoutTs || loginTime, durationHours, durationMinutes };
                });
                allPlayers.sort((a, b) => (a.isOnline === b.isOnline) ? (a.isOnline ? a.loginTime - b.loginTime : b.logoutTime - a.logoutTime) : (a.isOnline ? -1 : 1));
                document.getElementById('header-count').textContent = allPlayers.filter(p => p.isOnline).length;
                renderPlayers(); setInterval(updateDurations, 60000);
            } catch (error) { document.getElementById('player-grid').innerHTML = '<div class="col-span-full text-center text-red-400">Failed to load player data</div>'; }
        }
        function renderPlayers() {
            const grid = document.getElementById('player-grid'); const searchTerm = document.getElementById('player-search').value.toLowerCase();
            grid.innerHTML = '';
            const filtered = allPlayers.filter(p => p.username.toLowerCase().includes(searchTerm));
            if (filtered.length === 0) { grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No players found</div>'; return; }
            filtered.slice(0, 100).forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card bg-gray-900 border border-gray-800 rounded-lg p-4 flex flex-col items-center gap-3 relative cursor-pointer';
                card.onclick = () => { updateURL(null, player.username); showProfileView(player.username); };
                const statusClass = player.isOnline ? 'status-online' : 'status-offline';
                let displayText = ''; let tooltipTime = ''; let iconName = '';
                if (player.isOnline) {
                    iconName = 'clock'; displayText = `Online for <span class="duration-text" data-login="${player.loginTime}">${player.durationHours}h ${player.durationMinutes}m</span>`;
                    tooltipTime = new Date(player.loginTime).toLocaleString();
                } else {
                    iconName = 'log-out'; tooltipTime = new Date(player.logoutTime).toLocaleString();
                    const diffMs = Date.now() - player.logoutTime;
                    const diffDays = Math.floor(diffMs / 86400000);
                    displayText = diffDays < 1 ? `Offline < 1 day` : `Offline for ${diffDays} days`;
                }
                const imgContainer = document.createElement('div'); imgContainer.className = 'relative';
                const img = document.createElement('img'); img.className = 'w-20 h-20 rounded-md shadow-lg bg-gray-800'; resolveAvatarUrl(player.username, img);
                const statusIndicator = document.createElement('div'); statusIndicator.className = `${statusClass} status-indicator`;
                imgContainer.appendChild(img); imgContainer.appendChild(statusIndicator);
                card.innerHTML = `<div class="font-bold text-white text-lg truncate w-full text-center mt-2">${player.username}</div><div class="text-center w-full mt-1"><div class="relative group cursor-help flex items-center justify-center gap-2 text-sm text-gray-400 font-medium"><i data-feather="${iconName}" class="w-4 h-4"></i><span>${displayText}</span><div class="time-tooltip">${tooltipTime}</div></div></div>`;
                card.prepend(imgContainer); grid.appendChild(card);
            });
            feather.replace();
        }
        function updateDurations() {
            const now = Date.now();
            document.querySelectorAll('.duration-text').forEach(el => {
                const loginTime = parseInt(el.dataset.login);
                if (loginTime) { const diff = now - loginTime; el.textContent = `Online for ${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m`; }
            });
        }
        function updateURL(searchTerm, player) {
            const url = new URL(window.location);
            if (searchTerm !== null) searchTerm ? url.searchParams.set('search', searchTerm) : url.searchParams.delete('search');
            if (player !== null) player ? window.history.pushState({}, '', player) : url.searchParams.delete('player');
            window.history.pushState({}, '', url);
        }
    </script>
