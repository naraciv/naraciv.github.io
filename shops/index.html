<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shops | Nara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Mobile Responsive Improvements for Shops Page */
        @media (max-width: 768px) {
            .max-w-6xl {
                max-width: 100%;
            }
            
            .w-5\/6 {
                width: 100% !important;
            }
            
            /* Stack filter controls */
            .flex.items-center.justify-between.mb-6 {
                flex-direction: column;
                align-items: stretch !important;
                gap: 1rem;
            }
            
            /* Full width elements */
            .flex.gap-2,
            .w-1\/2 {
                width: 100% !important;
            }
            
            /* Better button sizing */
            .city-filter-btn {
                flex: 1;
                min-width: 0;
                font-size: 0.875rem;
                white-space: nowrap;
            }
            
            /* Search bar adjustments */
            #search-input {
                font-size: 14px;
            }
            
            /* Full width table container */
            .w-\[80\%\] {
                width: 100% !important;
            }
            
            /* Smaller table cells */
            table th,
            table td {
                padding: 0.5rem 0.25rem !important;
                font-size: 0.7rem !important;
            }
            
            /* Tags grid */
            #tags-filter {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            
            .tag-filter-btn {
                font-size: 0.7rem;
                padding: 0.375rem 0.5rem !important;
            }
            
            /* Advanced options */
            #advanced-options-dropdown summary {
                font-size: 1rem;
            }
            
            /* Selected tags display */
            #selected-tags-container div {
                font-size: 0.7rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem !important;
            }
            
            table th,
            table td {
                padding: 0.375rem 0.125rem !important;
                font-size: 0.65rem !important;
            }
            
            /* Hide some columns on very small screens if needed */
            table th:nth-child(5),
            table td:nth-child(5) {
                display: none;
            }
        }

        table th,
        table td {
            word-wrap: break-word;
            min-width: 100px;
            max-width: 200px;
        }

        /* Update mobile styles */
        @media (max-width: 768px) {
            table th,
            table td {
                min-width: 80px;
                max-width: 150px;
            }
        }

        @media (max-width: 480px) {
            table th,
            table td {
                min-width: 60px;
                max-width: 120px;
            }
        }

        .coord-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #2596be;
            transition: width 0.3s;
        }

        .coord-link:hover::after {
            width: 100%;
        }

        .coord-link:hover {
            color: #2596be;
        }

        /* Lore tooltip styles */
         .lore-icon {
            cursor: help;
            margin-left: 4px;
            display: inline-block;
            vertical-align: middle;
            position: relative;
        }

        .lore-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            z-index: 1000;
            background-color: #1f2937;
            color: #fff;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            font-size: 0.875rem;
            white-space: pre-wrap;
            width: 15vw;
            min-width: 200px;
            max-width: 400px;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            transition: opacity 0.3s, visibility 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .lore-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #1f2937 transparent transparent transparent;
        }

        .lore-icon:hover .lore-tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* Item icon styles */
        .item-icon {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        @media (max-width: 768px) {
            .item-icon {
                width: 20px;
                height: 20px;
            }
        }

        @media (max-width: 480px) {
            .item-icon {
                width: 16px;
                height: 16px;
            }
        }

        /* Map View Styles */
        .map-view-container {
            display: flex;
            gap: 0;
            height: calc(100vh - 200px);
            min-height: 500px;
        }

        .map-sidebar {
            width: 340px;
            min-width: 280px;
            max-width: 400px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 0.5rem 0 0 0.5rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .map-sidebar::-webkit-scrollbar { width: 6px; }
        .map-sidebar::-webkit-scrollbar-track { background: #1f2937; }
        .map-sidebar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.8rem;
        }

        .sidebar-item:hover {
            background: #1f2937;
        }

        .sidebar-item.highlighted {
            background: #1e3a5f;
            border-left: 3px solid #2596be;
        }

        .sidebar-item .item-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .sidebar-item-name {
            flex: 1;
            color: #d1d5db;
            word-break: break-word;
        }

        .shop-map-container {
            flex: 1;
            position: relative;
            background: #1a1a1a;
            border-radius: 0 0.5rem 0.5rem 0;
            overflow: hidden;
            cursor: grab;
        }

        .shop-map-container:active {
            cursor: grabbing;
        }

        .shop-map-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .shop-tile-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .shop-tile-layer img {
            position: absolute;
            opacity: 0.45;
            image-rendering: pixelated;
        }

        .map-city-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            display: flex;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .map-city-toggle button {
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #9ca3af;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }

        .map-city-toggle button.active {
            background: #2596be;
            color: white;
        }

        .map-city-toggle button:hover:not(.active) {
            background: #374151;
        }

        .map-controls-shop {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 30;
        }

        .map-ctrl-btn {
            width: 36px;
            height: 36px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            border-radius: 0.375rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 1.1rem;
        }

        .map-ctrl-btn:hover {
            background: #374151;
        }

        .map-coords-display {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #374151;
            border-radius: 0.375rem;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 0.75rem;
            color: white;
            z-index: 30;
            pointer-events: none;
        }

        /* Map exchange tooltip */
        .map-exchange-tooltip {
            position: fixed;
            background: rgba(17, 24, 39, 0.97);
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            padding: 0;
            z-index: 1000;
            pointer-events: none;
            min-width: 200px;
            max-width: 420px;
            max-height: 260px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .map-exchange-tooltip.pinned {
            pointer-events: auto;
        }

        /* Sidebar lore popover */
        .sidebar-lore-icon {
            color: #6b7280;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }

        .sidebar-lore-icon:hover {
            color: #2596be;
        }

        .lore-popover {
            position: fixed;
            z-index: 1100;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            padding: 10px 14px;
            max-width: 320px;
            min-width: 180px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 0.8rem;
            color: #d1d5db;
            white-space: pre-wrap;
            line-height: 1.5;
            pointer-events: auto;
        }

        .lore-popover::-webkit-scrollbar { width: 4px; }
        .lore-popover::-webkit-scrollbar-track { background: transparent; }
        .lore-popover::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }

        .lore-popover .lore-popover-header {
            font-size: 0.65rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #374151;
        }

        .lore-popover .lore-section {
            margin-bottom: 8px;
        }

        .lore-popover .lore-section:last-child {
            margin-bottom: 0;
        }

        .lore-popover .lore-section-label {
            font-size: 0.65rem;
            color: #2596be;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .map-exchange-tooltip .tooltip-header {
            padding: 5px 8px;
            border-bottom: 1px solid #374151;
            font-size: 0.65rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .map-exchange-tooltip .tooltip-body {
            max-height: 200px;
            overflow-y: auto;
            padding: 4px 0;
            overscroll-behavior: contain;
        }

        .map-exchange-tooltip .tooltip-body::-webkit-scrollbar { width: 5px; }
        .map-exchange-tooltip .tooltip-body::-webkit-scrollbar-track { background: #1f2937; border-radius: 3px; }
        .map-exchange-tooltip .tooltip-body::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 3px; }
        .map-exchange-tooltip .tooltip-body::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        .tooltip-exchange-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-bottom: 1px solid #1f2937;
            font-size: 0.7rem;
        }

        .tooltip-exchange-row:last-child { border-bottom: none; }

        .tooltip-exchange-row img {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .tooltip-exchange-row .arrow {
            color: #6b7280;
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        .tooltip-exchange-row .exchange-coords {
            color: #6b7280;
            font-size: 0.6rem;
            font-family: monospace;
            flex-shrink: 0;
            min-width: 65px;
        }

        .tooltip-exchange-row .exchange-text {
            color: #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tooltip-scroll-hint {
            font-size: 0.65rem;
            color: #9ca3af;
            text-align: center;
            padding: 4px 0 6px;
            border-top: 1px solid #374151;
            background: linear-gradient(transparent, rgba(17, 24, 39, 0.95));
        }

        .view-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #374151;
            background: #1f2937;
            color: #d1d5db;
        }

        .view-toggle-btn:hover {
            border-color: #2596be;
            color: white;
        }

        .view-toggle-btn.active {
            background: #2596be;
            border-color: #2596be;
            color: white;
        }

        .sidebar-item-subtext {
            font-size: 0.6rem;
            color: #6b7280;
            margin-top: 1px;
        }

        .sidebar-item-content {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .sidebar-item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sidebar-pinned-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1e3a5f;
            border-bottom: 1px solid #2596be;
        }

        .sidebar-pinned-header span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #93c5fd;
        }

        .sidebar-clear-btn {
            font-size: 0.65rem;
            color: #9ca3af;
            background: none;
            border: 1px solid #4b5563;
            border-radius: 0.25rem;
            padding: 2px 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sidebar-clear-btn:hover {
            color: white;
            border-color: #2596be;
        }

        .search-hint-tooltip {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            animation: searchHintFade 0.5s ease-out;
        }

        .search-hint-tooltip .hint-text {
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        @keyframes searchHintFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .map-view-container {
                flex-direction: column;
                height: auto;
            }
            .map-sidebar {
                width: 100%;
                max-width: 100%;
                max-height: 200px;
                border-radius: 0.5rem 0.5rem 0 0;
            }
            .shop-map-container {
                min-height: 400px;
                border-radius: 0 0 0.5rem 0.5rem;
            }
        }
    </style>
    
<script src="../components/analytics.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">
    <script src="../components/navbar.js"></script>
    <custom-navbar></custom-navbar>

    <div class="h-[100px]"></div>

    <main class="flex-grow py-20 px-4">
        <div class="max-w-[90%] mx-auto w-[90%]">
            <h1 class="text-5xl font-bold mb-16 text-center text-primary">Shops</h1>
            
            <!-- Search and Filter Controls -->
            <div class="mb-8">
                <!-- City Filter Buttons and Search Bar -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex gap-2">
                        <button id="all-btn" class="city-filter-btn active px-4 py-2 rounded-full border border-nara-red bg-nara-red text-white transition-colors font-bold">
                            All
                        </button>
                        <button id="shiroyama-btn" class="city-filter-btn active px-4 py-2 rounded-full border border-nara-red bg-nara-red text-white transition-colors font-bold">
                            Shiroyama
                        </button>
                        <button id="orakuru-btn" class="city-filter-btn active px-4 py-2 rounded-full border border-nara-red bg-nara-red text-white transition-colors font-bold">
                            Orakuru
                        </button>
                    </div>
                </div>

              <!-- Advanced Options -->
<div class="mb-6">
    <details class="group" id="advanced-options-dropdown">
      <summary class="flex items-center gap-2 cursor-pointer text-primary hover:text-white transition-colors">
        <i data-feather="chevron-down" class="w-6 h-6 transition-transform" id="advanced-chevron"></i>
        <span class="text-lg font-semibold">Advanced Options</span>
      </summary>
      <div class="mt-4 space-y-4">
        <!-- Tags Dropdown -->
        <div>
          <details class="group" id="tags-dropdown">
            <summary
              class="flex items-center gap-2 cursor-pointer text-gray-300 hover:text-white transition-colors bg-gray-800 border border-gray-700 rounded-full px-4 py-2 min-h-12 w-full max-w-md">
              <i data-feather="chevron-down"
                 class="chevron-icon w-4 h-4 transition-transform duration-200 flex items-center"
                 id="tags-selector-chevron"></i>
              <div id="selected-tags-container" class="flex flex-wrap gap-1 items-center">
                <span class="text-gray-400 text-sm">Select Tags</span>
              </div>
            </summary>
            <div class="mt-2 p-2 w-full max-w-md rounded-lg">
              <div id="tags-filter" class="grid grid-cols-3 gap-2">
                <!-- Tags will be populated by JavaScript -->
              </div>
            </div>
          </details>
        </div>
  
        <!-- Exclude Out-of-Stock Toggle -->
        <div>
          <label class="flex items-center gap-3 cursor-pointer select-none">
            <input type="checkbox" id="exclude-out-of-stock"
                   class="w-5 h-5 rounded-full bg-gray-700 border-gray-600 checked:bg-nara-red focus:ring-nara-red focus:ring-2 transition duration-200">
            <span class="text-gray-300">Exclude out of stock shops</span>
          </label>
        </div>
      </div>
    </details>
  </div>
  

            <!-- View Toggle + Search Bar -->
            <div class="flex items-center gap-3 mb-6">
                <button id="table-view-btn" class="view-toggle-btn active" onclick="switchView('table')">
                    <i data-feather="list" class="w-4 h-4"></i> Table
                </button>
                <button id="map-view-btn" class="view-toggle-btn" onclick="switchView('map')">
                    <i data-feather="map" class="w-4 h-4"></i> Map
                </button>

                <!-- Search Bar with Field Selector -->
                <div class="w-1/2 ml-auto relative bg-gray-900 border border-gray-700 rounded-full focus-within:border-nara-red transition-colors h-10">
                    <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="search-input" placeholder="Search shops..." 
                           class="w-full h-full pl-9 pr-32 bg-transparent text-white text-sm placeholder-gray-400 focus:outline-none rounded-full">
                    <details class="absolute right-0 top-0 h-full group" id="field-selector-dropdown">
                        <summary class="h-full px-3 py-1 bg-gray-900 border-0 rounded-full text-white text-sm cursor-pointer hover:text-nara-red transition-colors flex items-center justify-center">
                            <i data-feather="chevron-down" class="chevron-icon w-7 h-4 ml-1 transition-transform" id="field-selector-chevron"></i>
                            <span id="selected-field"> All Fields</span>
                        </summary>
                        <div class="absolute right-0 top-full mt-1 bg-gray-900 border border-gray-700 rounded-lg shadow-lg min-w-full" style="z-index:1200; opacity:1;">
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="all">All Fields</button>
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="input">Input</button>
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="output">Output</button>
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="coords">Coords</button>
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="contact">Contact (IGN)</button>
                            <button class="field-option w-full text-left px-3 py-2 text-white hover:bg-gray-800 transition-colors text-sm" data-value="city">City</button>
                        </div>
                    </details>
                </div>
            </div>

            <!-- Data Table -->
            <div id="table-view" class="w-[100%] bg-gray-900 rounded-lg border border-gray-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full table-fixed">
                        <thead class="bg-gray-800">
                            <tr>
                                <th class="w-1/6 px-6 py-4 text-left text-sm font-semibold text-primary cursor-pointer hover:text-white transition-colors whitespace-nowrap" onclick="sortTable(1)">
                                    <div class="flex items-center">
                                        <i data-feather="chevron-up" class="sort-arrow w-4 h-4 mr-1" style="transition: transform 0.2s, opacity 0.2s;"></i>
                                        <span>Input</span>
                                    </div>
                                </th>
                                <th class="w-1/6 px-6 py-4 text-left text-sm font-semibold text-primary cursor-pointer hover:text-white transition-colors whitespace-nowrap" onclick="sortTable(3)">
                                    <div class="flex items-center">
                                        <i data-feather="chevron-up" class="sort-arrow w-4 h-4 mr-1 transition-all duration-200"></i>
                                        <span>Output</span>
                                    </div>
                                </th>
                                <th class="w-1/6 px-6 py-4 text-left text-sm font-semibold text-primary cursor-pointer hover:text-white transition-colors whitespace-nowrap" onclick="sortTable(5)">
                                    <div class="flex items-center">
                                        <i data-feather="chevron-up" class="sort-arrow w-4 h-4 mr-1 transition-all duration-200"></i>
                                        <span>Coords</span>
                                    </div>
                                </th>
                                <th class="w-1/6 px-6 py-4 text-left text-sm font-semibold text-primary cursor-pointer hover:text-white transition-colors whitespace-nowrap" onclick="sortTable(7)">
                                    <div class="flex items-center">
                                        <i data-feather="chevron-up" class="sort-arrow w-4 h-4 mr-1 transition-all duration-200"></i>
                                        <span>City</span>
                                    </div>
                                </th>
                                <th class="w-1/6 px-6 py-4 text-left text-sm font-semibold text-primary cursor-pointer hover:text-white transition-colors whitespace-nowrap" onclick="sortTable(9)">
                                    <div class="flex items-center">
                                        <i data-feather="chevron-up" class="sort-arrow w-4 h-4 mr-1 transition-all duration-200"></i>
                                        <span>Contact</span>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="shop-table-body" class="divide-y divide-gray-700">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Map View -->
            <div id="map-view" class="hidden">
                <div class="map-view-container">
                    <!-- Sidebar -->
                    <div class="map-sidebar" id="map-sidebar">
                        <div class="p-3 border-b border-gray-700 sticky top-0 bg-gray-900 z-10">
                            <div class="text-sm font-semibold text-white">Shops · <span id="sidebar-count">0</span></div>
                            <div class="sidebar-item-subtext" style="margin-top:2px">Click to show on map</div>
                        </div>
                        <div id="sidebar-list"></div>
                    </div>
                    <!-- Map -->
                    <div class="shop-map-container" id="shop-map-container">
                        <div class="shop-tile-layer" id="shop-tile-layer"></div>
                        <canvas class="shop-map-canvas" id="shop-map-canvas"></canvas>
                        <!-- City Toggle -->
                        <div class="map-city-toggle">
                            <button id="map-shiroyama-btn" class="active" onclick="mapGoToCity('shiroyama')">Shiroyama</button>
                            <button id="map-orakuru-btn" onclick="mapGoToCity('orakuru')">Orakuru</button>
                        </div>
                        <!-- Zoom Controls -->
                        <div class="map-controls-shop">
                            <button class="map-ctrl-btn" onclick="mapZoom(1)" title="Zoom in">+</button>
                            <button class="map-ctrl-btn" onclick="mapZoom(-1)" title="Zoom out">−</button>
                        </div>
                        <!-- Coords -->
                        <div class="map-coords-display" id="map-coords-display">0, 0</div>
                    </div>
                </div>
            </div>

            <!-- Exchange Tooltip (shared, appended to body) -->
            <div class="map-exchange-tooltip" id="map-exchange-tooltip" style="display:none;"></div>

        </div>
    </main>

    <custom-footer></custom-footer>
    <script src="../components/footer.js"></script>
    <script>
        feather.replace();
        
        let shopData = [];
        let filteredData = [];
        let processedData = []; // Add this to store processed versions
        let currentSortColumn = null;
        let sortDirection = 'asc';
        let selectedCities = { all: true, shiroyama: true, orakuru: true };
        let selectedTags = new Set();
        let availableTags = new Set();
        
        // Load CSV from Sanity CMS (most recent shopEntry)
        const SANITY_PROJECT_ID = 'scdpub0o';
        const SANITY_DATASET = 'production';
        const SANITY_API_VERSION = '2021-10-21';
        const SANITY_CDN = `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}`;

        const shopQuery = encodeURIComponent(
            `*[_type == "shopEntry"] | order(_createdAt desc)[0] { "csvUrl": csv_file.asset->url }`
        );

        fetch(`${SANITY_CDN}?query=${shopQuery}`)
            .then(response => response.json())
            .then(data => {
                const csvUrl = data?.result?.csvUrl;
                if (!csvUrl) throw new Error('No shop CSV found in Sanity');
                return fetch(csvUrl);
            })
            .then(response => response.text())
            .then(csvText => {
                const results = Papa.parse(csvText, { header: false, skipEmptyLines: true });
                shopData = results.data.slice(1); // skip header row
                processAllData(); // Process data on load
                filteredData = [...processedData];
                init();
            })
            .catch(err => console.error('Error loading shop data from Sanity:', err));
        
        // Load filters from URL on page load
        function loadFiltersFromURL() {
            const params = new URLSearchParams(window.location.search);
            
            // Load search query
            const searchQuery = params.get('search');
            if (searchQuery) {
                document.getElementById('search-input').value = searchQuery;
            }
            
            // Load search field
            const searchField = params.get('field');
            if (searchField) {
                window.selectedSearchField = searchField;
                const fieldText = {
                    'all': 'All Fields',
                    'input': 'Input',
                    'output': 'Output',
                    'coords': 'Coords',
                    'contact': 'Contact (IGN)',
                    'city': 'City'
                };
                document.getElementById('selected-field').textContent = ' ' + (fieldText[searchField] || 'All Fields');
            }
            
            // Load tags
            const tagsParam = params.get('tags');
            if (tagsParam) {
                const tags = tagsParam.split(',');
                tags.forEach(tag => selectedTags.add(tag));
            }
            
            // Load cities
            const citiesParam = params.get('cities');
            if (citiesParam) {
                const cities = citiesParam.split(',');
                selectedCities.all = cities.includes('all');
                selectedCities.shiroyama = cities.includes('shiroyama');
                selectedCities.orakuru = cities.includes('orakuru');
            }
            
            // Load exclude out of stock
            const excludeOutOfStock = params.get('exclude_oos');
            if (excludeOutOfStock === 'true') {
                document.getElementById('exclude-out-of-stock').checked = true;
            }
            
            // Load sort column and direction
            const sortCol = params.get('sort_col');
            const sortDir = params.get('sort_dir');
            if (sortCol) {
                currentSortColumn = parseInt(sortCol);
                sortDirection = sortDir || 'asc';
            }
            
            // Load view type
            const viewType = params.get('type');
            if (viewType === 'map') {
                // Defer to after init renders, so DOM is ready
                setTimeout(() => switchView('map'), 0);
            }
        }
        
        // Update URL with current filters
        function updateURL() {
            const params = new URLSearchParams();
            
            // Add search query
            const searchQuery = document.getElementById('search-input').value;
            if (searchQuery) {
                params.set('search', searchQuery);
            }
            
            // Add search field
            const searchField = window.selectedSearchField;
            if (searchField && searchField !== 'all') {
                params.set('field', searchField);
            }
            
            // Add tags
            if (selectedTags.size > 0) {
                params.set('tags', Array.from(selectedTags).join(','));
            }
            
            // Add cities if not all selected
            if (!selectedCities.all) {
                const activeCities = [];
                if (selectedCities.shiroyama) activeCities.push('shiroyama');
                if (selectedCities.orakuru) activeCities.push('orakuru');
                if (activeCities.length > 0) {
                    params.set('cities', activeCities.join(','));
                }
            }
            
            // Add exclude out of stock
            if (document.getElementById('exclude-out-of-stock').checked) {
                params.set('exclude_oos', 'true');
            }
            
            // Add sort column and direction
            if (currentSortColumn !== null) {
                params.set('sort_col', currentSortColumn);
                params.set('sort_dir', sortDirection);
            }
            
            // Add view type
            if (currentView === 'map') {
                params.set('type', 'map');
            }
            
            // Update URL without reloading
            const newURL = params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            window.history.pushState({}, '', newURL);
        }
        
        // Process all data upfront
        function processAllData() {
            processedData = shopData.map(row => {
                const newRow = [...row];
                
                // Process Input (index 1) with Input_Lore (index 2)
                const inputLore = row[2] || '';
                const { displayName: processedInput } = processItemWithLore(row[1], inputLore);
                newRow[1] = processedInput;
                
                // Process Output (index 3) with Output_Lore (index 4)
                const outputLore = row[4] || '';
                const { displayName: processedOutput } = processItemWithLore(row[3], outputLore);
                newRow[3] = processedOutput;
                
                return newRow;
            });
        }
        
        // Initialize everything
        function init() {
            extractTags();
            loadFiltersFromURL(); // Load filters from URL before rendering
            renderTagsFilter();
            updateCityFilterButtons(); // Update city button styles based on loaded filters
            updateSelectedTagsDisplay();
            
            // Apply sort if loaded from URL
            if (currentSortColumn !== null) {
                filteredData.sort((a, b) => {
                    const aVal = (a[currentSortColumn] || '').toLowerCase();
                    const bVal = (b[currentSortColumn] || '').toLowerCase();
                    return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                });
            }
            
            filterData(); // This will render the table with filters applied
            setupEventListeners();
            setupDropdownAnimations();
            updateSortIndicators();
        }
        
        // Extract unique tags from CSV
        function extractTags() {
            shopData.forEach(row => {
                const tagsString = row[8]; // Tags column is now at index 8
                if (tagsString && tagsString.trim()) {
                    tagsString.split(',').map(t => t.trim()).forEach(tag => availableTags.add(tag));
                }
            });
        }
        
        // Render tag filter buttons
        function renderTagsFilter() {
            const tagsContainer = document.getElementById('tags-filter');
            tagsContainer.innerHTML = '';
            Array.from(availableTags).sort().forEach(tag => {
                const btn = document.createElement('button');
                const isActive = selectedTags.has(tag);
                btn.className = `tag-filter-btn px-3 py-2 rounded-full border transition-colors text-xs ${
                    isActive 
                        ? 'bg-nara-red border-nara-red text-white' 
                        : 'border-gray-600 bg-gray-900 text-gray-300 hover:border-nara-red hover:text-white'
                }`;
                if (isActive) btn.classList.add('active');
                btn.textContent = tag;
                btn.dataset.tag = tag;
                btn.addEventListener('click', () => toggleTagFilter(tag));
                tagsContainer.appendChild(btn);
            });
        }
        
        // Toggle tag selection
        function toggleTagFilter(tag) {
            const btn = document.querySelector(`[data-tag="${tag}"]`);
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                btn.classList.remove('active', 'bg-nara-red', 'border-nara-red', 'text-white');
                btn.classList.add('border-gray-600', 'text-gray-300');
            } else {
                selectedTags.add(tag);
                btn.classList.add('active', 'bg-nara-red', 'border-nara-red', 'text-white');
                btn.classList.remove('border-gray-600', 'text-gray-300');
            }
            updateSelectedTagsDisplay();
            filterData();
            updateURL();
        }
        
        // Update the selected tags display
        function updateSelectedTagsDisplay() {
            const container = document.getElementById('selected-tags-container');
            container.innerHTML = '';
            if (selectedTags.size === 0) {
                container.innerHTML = '<span class="text-gray-400 text-sm">Select Tags</span>';
                return;
            }
            selectedTags.forEach(tag => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-1 bg-nara-red text-white px-2 py-1 rounded-full border border-white text-xs';
                const removeBtn = document.createElement('button');
                removeBtn.onclick = () => removeTag(tag);
                removeBtn.innerHTML = '<i data-feather="x" class="w-3 h-3"></i>';
                const tagSpan = document.createElement('span');
                tagSpan.textContent = tag;
                el.appendChild(removeBtn);
                el.appendChild(tagSpan);
                container.appendChild(el);
            });
            feather.replace();
        }
        
        // Remove tag from selection
        function removeTag(tag) {
            selectedTags.delete(tag);
            const btn = document.querySelector(`[data-tag="${tag}"]`);
            if (btn) {
                btn.classList.remove('active', 'bg-nara-red', 'border-nara-red', 'text-white');
                btn.classList.add('border-gray-600', 'text-gray-300');
            }
            filterData();
            updateSelectedTagsDisplay();
            updateURL();
        }
        
        // Setup button event listeners
        function setupEventListeners() {
            document.getElementById('all-btn').addEventListener('click', () => toggleCityFilter('all'));
            document.getElementById('shiroyama-btn').addEventListener('click', () => toggleCityFilter('shiroyama'));
            document.getElementById('orakuru-btn').addEventListener('click', () => toggleCityFilter('orakuru'));
        
            document.getElementById('search-input').addEventListener('input', () => {
                filterData();
                updateURL();
            });
            document.getElementById('exclude-out-of-stock').addEventListener('change', () => {
                filterData();
                updateURL();
            });
        
            document.querySelectorAll('.field-option').forEach(option => {
                option.addEventListener('click', () => {
                    window.selectedSearchField = option.dataset.value;
                    document.getElementById('selected-field').textContent = ' ' + option.textContent;
                    filterData();
                    updateURL();
                });
            });
        }
        
        // Toggle city filters
        function toggleCityFilter(city) {
            if (city === 'all') {
                const newState = !selectedCities.all;
                selectedCities.all = newState;
                selectedCities.shiroyama = newState;
                selectedCities.orakuru = newState;
            } else {
                selectedCities[city] = !selectedCities[city];
                selectedCities.all = selectedCities.shiroyama && selectedCities.orakuru;
            }
            updateCityFilterButtons();
            filterData();
            updateURL();
        }
        
        // Update city filter button styles
        function updateCityFilterButtons() {
            const allBtn = document.getElementById('all-btn');
            const shiroyamaBtn = document.getElementById('shiroyama-btn');
            const orakuruBtn = document.getElementById('orakuru-btn');
        
            // Helper
            const updateButton = (btn, active) => {
                if (active) {
                    btn.classList.add('active', 'bg-nara-red', 'border-nara-red', 'text-white');
                    btn.classList.remove('border-gray-600', 'text-gray-300');
                } else {
                    btn.classList.remove('active', 'bg-nara-red', 'border-nara-red', 'text-white');
                    btn.classList.add('border-gray-600', 'text-gray-300');
                }
            };
        
            updateButton(allBtn, selectedCities.all);
            updateButton(shiroyamaBtn, selectedCities.shiroyama);
            updateButton(orakuruBtn, selectedCities.orakuru);
        }
        
        // Filter data based on city, tags, search, out-of-stock
        function filterData() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const searchField = window.selectedSearchField || 'all';
            const excludeOutOfStock = document.getElementById('exclude-out-of-stock').checked;
        
            filteredData = processedData.filter((row, index) => {
                const originalRow = shopData[index]; // Get original row for tags
                const city = (row[7] || '').toLowerCase(); // City is now at index 7
                if (!selectedCities.all) {
                    if (!(selectedCities.shiroyama && city === 'shiroyama') &&
                        !(selectedCities.orakuru && city === 'orakuru')) return false;
                }
        
                if (selectedTags.size > 0) {
                    const rowTags = (originalRow[8] || '').split(',').map(t => t.trim()); // Tags at index 8
                    if (![...selectedTags].some(tag => rowTags.includes(tag))) return false;
                }
        
                if (searchTerm) {
                    if (searchField === 'all') {
                        // Search through processed data
                        if (!row.some(cell => cell.toLowerCase().includes(searchTerm))) return false;
                    } else {
                        const fieldIndex = { 'input': 1, 'output': 3, 'coords': 5, 'contact': 9, 'city': 7 };
                        // Search using processed data
                        if (!row[fieldIndex[searchField]].toLowerCase().includes(searchTerm)) return false;
                    }
                }
                
                // cute way to eliminate broken entries for now. TODO FIX WHEN STOCK FLAG IS INTRODUCED
                if (excludeOutOfStock && row[6]=='F') return false;
        
                return true;
            });
        
            renderTable();
        }
        
        // Extract item name for icon URL
        function extractItemName(itemString, loreText = '') {
            if (!itemString) return null;
            
            // Remove leading whitespace
            let cleaned = itemString.trim();
            
            // Remove leading numbers and spaces, including ranges like "42-62"
            cleaned = cleaned.replace(/^\d+(-\d+)?\s*/, '');
            
            // Remove anything in quotes (e.g., '1 Barrel "Repair Kit"' -> 'Barrel')
            cleaned = cleaned.replace(/"[^"]*"/g, '').trim();
            
            // If empty after cleaning, return null
            if (!cleaned) return null;
            
            // Convert to lowercase for matching
            let itemName = cleaned.toLowerCase();
            
            // Check if lore contains "Author" - map to written_book
            if (loreText && loreText.toLowerCase().includes('author')) {
                return 'written_book';
            }
            
            // Special case mappings
            const potionWords = ['strength', 'healing', 'regeneration', 'water breathing', 'resistance', 'fire resistance', 'invisibility', 'swiftness', 'night vision', 'leaping', 'slowness', 'poison', 'weakness', 'turtle master', 'slow falling'];
            for (const word of potionWords) {
                if (itemName.includes(word)) {
                    return 'potion';
                }
            }
            
            // Banner -> white_banner
            if (itemName.includes('banner')) {
                return 'white_banner';
            }
            
            // Book and Quill -> writable_book
            if (itemName === 'book and quill') {
                return 'writable_book';
            }
            
            // Slimeball -> slime_ball
            if (itemName === 'slimeball') {
                return 'slime_ball';
            }
            
            // Netherite Upgrade -> netherite_upgrade_smithing_template
            if (itemName === 'netherite upgrade') {
                return 'netherite_upgrade_smithing_template';
            }
            
            // Nether Quartz -> quartz
            if (itemName === 'nether quartz') {
                return 'quartz';
            }
            
            // Anything with Shield -> shield
            if (itemName.includes('shield')) {
                return 'shield';
            }
            
            // Eye of Ender -> ender_eye
            if (itemName === 'eye of ender') {
                return 'ender_eye';
            }
            
            // Lapis Lazuli -> lapis (Minecraft uses lapis_ore, lapis_block, not lapis_lazuli_ore)
            itemName = itemName.replace('lapis lazuli', 'lapis');
            
            // Bucket of X -> X_bucket (e.g., "bucket of axolotl" -> "axolotl_bucket")
            const bucketOfMatch = itemName.match(/^bucket of\s+(.+)$/);
            if (bucketOfMatch) {
                return bucketOfMatch[1].replace(/\s+/g, '_') + '_bucket';
            }
            
            // Block of X -> X_block (e.g., "block of iron" -> "iron_block")
            const blockOfMatch = itemName.match(/^block of\s+(.+)$/);
            if (blockOfMatch) {
                return blockOfMatch[1].replace(/\s+/g, '_') + '_block';
            }
            
            // Default: replace spaces with underscores
            return itemName.replace(/\s+/g, '_');
        }
        
        // Get icon URL for an item
        function getItemIconUrl(itemString, loreText = '') {
            const itemName = extractItemName(itemString, loreText);
            if (!itemName) return null;
            return `https://mc.nerothe.com/img/1.21.8/minecraft_${itemName}.png`;
        }
        
        // Process item name and lore
        function processItemWithLore(itemName, loreText) {
            let displayName = itemName;
            let loreContent = loreText;
            
            // Check if lore contains "Compacted Item"
            if (loreContent && loreContent.includes('Compacted Item')) {
                displayName += ' (CI)';
                loreContent = loreContent.replace(/Compacted Item,?\s*/gi, '').trim();
            }
            
            // Check if lore contains "Crate"
            if (loreContent && loreContent.includes('Crate')) {
                displayName += ' (Crate)';
                loreContent = loreContent.replace(/Crate,?\s*/gi, '').trim();
            }
            
            // Process lore content for display
            if (loreContent) {
                // Remove leading | if it's the first non-whitespace character
                loreContent = loreContent.replace(/^\s*\|/, '');
                // Replace remaining | with newlines
                loreContent = loreContent.replace(/\|/g, '\n');
                // Strip out § followed by any letter (Minecraft formatting codes)
                loreContent = loreContent.replace(/§[a-zA-Z]/g, '');
            }
            
            return { displayName, loreContent };
        }
        
        // Render table
        function renderTable() {
            const tbody = document.getElementById('shop-table-body');
            tbody.innerHTML = '';
            filteredData.forEach((row, rowIndex) => {
                const originalIndex = processedData.indexOf(row);
                const originalRow = shopData[originalIndex];
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800 transition-colors';
                
                // Column indices: 0=Timestamp, 1=Input, 2=Input_Lore, 3=Output, 4=Output_Lore, 5=Coordinates, 6=Exchanges_Available, 7=City, 8=Tags, 9=Contact
                const displayColumns = [1, 3, 5, 7, 9]; // Input, Output, Coordinates, City, Contact
                
                displayColumns.forEach(i => {
                    const td = document.createElement('td');
                    td.className = 'px-6 py-4 text-sm text-gray-300 break-words whitespace-normal';
                    td.style.maxWidth = '200px';
                    
                    let cell = row[i] || '';
                    
                    // Handle Input column (index 1) with Input_Lore (index 2)
                    if (i === 1) {
                        const inputLore = originalRow[2] || '';
                        const { loreContent } = processItemWithLore(originalRow[1], inputLore);
                        
                        // Create wrapper for icon and text
                        const wrapper = document.createElement('div');
                        wrapper.className = 'flex items-center gap-2';
                        
                        // Add item icon (pass lore for special mappings like written_book)
                        const iconUrl = getItemIconUrl(originalRow[1], inputLore);
                        if (iconUrl) {
                            const img = document.createElement('img');
                            img.src = iconUrl;
                            img.alt = '';
                            img.className = 'item-icon w-6 h-6 flex-shrink-0';
                            img.style.imageRendering = 'pixelated';
                            img.onerror = function() { this.style.display = 'none'; };
                            wrapper.appendChild(img);
                        }
                        
                        const span = document.createElement('span');
                        span.textContent = cell; // Use processed name from row
                        wrapper.appendChild(span);
                        
                        if (loreContent && loreContent.trim()) {
                            const icon = document.createElement('span');
                            icon.className = 'lore-icon';
                            icon.innerHTML = '<i data-feather="book-open" class="w-4 h-4 text-gray-400"></i>';
                            
                            const tooltip = document.createElement('span');
                            tooltip.className = 'lore-tooltip';
                            tooltip.textContent = loreContent;
                            
                            icon.appendChild(tooltip);
                            wrapper.appendChild(icon);
                        }
                        
                        td.appendChild(wrapper);
                    }
                    // Handle Output column (index 3) with Output_Lore (index 4)
                    else if (i === 3) {
                        const outputLore = originalRow[4] || '';
                        const { loreContent } = processItemWithLore(originalRow[3], outputLore);
                        
                        // Create wrapper for icon and text
                        const wrapper = document.createElement('div');
                        wrapper.className = 'flex items-center gap-2';
                        
                        // Add item icon (pass lore for special mappings like written_book)
                        const iconUrl = getItemIconUrl(originalRow[3], outputLore);
                        if (iconUrl) {
                            const img = document.createElement('img');
                            img.src = iconUrl;
                            img.alt = '';
                            img.className = 'item-icon w-6 h-6 flex-shrink-0';
                            img.style.imageRendering = 'pixelated';
                            img.onerror = function() { this.style.display = 'none'; };
                            wrapper.appendChild(img);
                        }
                        
                        const span = document.createElement('span');
                        span.textContent = cell; // Use processed name from row
                        wrapper.appendChild(span);
                        
                        if (loreContent && loreContent.trim()) {
                            const icon = document.createElement('span');
                            icon.className = 'lore-icon';
                            icon.innerHTML = '<i data-feather="book-open" class="w-4 h-4 text-gray-400"></i>';
                            
                            const tooltip = document.createElement('span');
                            tooltip.className = 'lore-tooltip';
                            tooltip.textContent = loreContent;
                            
                            icon.appendChild(tooltip);
                            wrapper.appendChild(icon);
                        }
                        
                        td.appendChild(wrapper);
                    }
                    // Handle Coordinates column (index 5)
                    else if (i === 5 && cell) {
                        const formattedCoords = cell.split(',').map(c => c.trim()).join(', ');
                        const coords = formattedCoords.split(',').map(c => c.trim());
                        
                        if (coords.length >= 3) {
                            const x = coords[0];
                            const z = coords[2];
                            const mapUrl = `https://map.civinfo.net/#c=${x},${z}`;
                            
                            const link = document.createElement('a');
                            link.href = mapUrl;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.textContent = formattedCoords;
                            link.className = 'coord-link transition-colors';
                            link.style.color = '#2596be';
                            link.style.textDecoration = 'none';
                            link.style.position = 'relative';
                            link.style.display = 'inline-block';
                            link.title = 'Open in CivInfo map';
                            
                            td.appendChild(link);
                        } else {
                            td.textContent = formattedCoords;
                        }
                    }
                    // Handle other columns normally
                    else {
                        td.title = cell;
                        td.textContent = cell;
                    }
                    
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            // Replace feather icons after rendering
            feather.replace();
            
            // Update map view if active
            if (typeof onFilterChange === 'function') onFilterChange();
        }
        
        // Modified sortTable function
        function sortTable(columnIndex) {
            // If clicking a different column, just select it (don't sort yet)
            if (currentSortColumn !== columnIndex) {
                currentSortColumn = columnIndex;
                sortDirection = 'asc'; // Reset to ascending for new column
                updateSortIndicators(); // Update visual indicators only
                updateURL();
                return; // Don't sort yet
            }
            
            // If clicking the same column, toggle sort direction and perform sort
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            
            filteredData.sort((a, b) => {
                const aVal = (a[columnIndex] || '').toLowerCase();
                const bVal = (b[columnIndex] || '').toLowerCase();
                return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
            });
            
            renderTable();
            updateSortIndicators();
            updateURL();
        }
        
        // Updated updateSortIndicators function
        function updateSortIndicators() {
            requestAnimationFrame(() => {
                document.querySelectorAll('th').forEach((th, i) => {
                    const icon = th.querySelector('.sort-arrow');
                    if (!icon) return;
                    
                    // Map display column index to actual data column index
                    const displayToDataMap = [1, 3, 5, 7, 9]; // Input, Output, Coords, City, Contact
                    const dataColumnIndex = displayToDataMap[i];
                    
                    // Show full opacity and white color only for selected column
                    if (dataColumnIndex === currentSortColumn) {
                        icon.style.opacity = '1';
                        th.classList.add('text-white');
                        th.classList.remove('text-primary');
                        icon.style.transform = sortDirection === 'desc' ? 'rotate(180deg)' : 'rotate(0deg)';
                    } else {
                        icon.style.opacity = '0.3';
                        th.classList.remove('text-white');
                        th.classList.add('text-primary');
                        icon.style.transform = 'rotate(0deg)';
                    }
                });
            });
        }
        
        // Dropdown animations
        function setupDropdownAnimations() {
            const dropdowns = [
                { id: 'field-selector-dropdown', chevronId: 'field-selector-chevron' },
                { id: 'tags-dropdown', chevronId: 'tags-selector-chevron' },
                { id: 'advanced-options-dropdown', chevronId: 'advanced-chevron' }
            ];
        
            dropdowns.forEach(({ id, chevronId }) => {
                const dropdown = document.getElementById(id);
                if (!dropdown) return;
                dropdown.addEventListener('toggle', () => {
                    const chevron = document.getElementById(chevronId);
                   if (chevron) {
                        chevron.style.transform = dropdown.open ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                });
            });
        }

        // ==================== MAP VIEW ====================
        let currentView = 'table'; // 'table' or 'map'
        let mapCanvas, mapCtx, mapTileLayer, mapContainer2;
        let mapInitialized = false;
        
        // Map state
        const TILE_SIZE = 256;
        
        // ---- Zoom config (edit these) ----
        const MAP_DEFAULT_ZOOM = 1;    // zoom when page first loads
        const MAP_CITY_ZOOM    = 1;    // zoom when switching cities
        const MAP_MIN_CLICK_ZOOM = 1;  // minimum zoom when clicking a sidebar item
        const MAP_MIN_ZOOM     = -6;   // furthest out
        const MAP_MAX_ZOOM     = 2.6;    // closest in
        // ----------------------------------
        
        let mapZoomLevel = MAP_DEFAULT_ZOOM;
        let mapViewX = 3313; // Start at Shiroyama
        let mapViewZ = 4913;
        let mapIsPanning = false;
        let mapPanStartX, mapPanStartY, mapPanStartViewX, mapPanStartViewZ;
        const mapTileElements = new Map();
        let mapCurrentCity = 'shiroyama';
        let mapHoveredCluster = null;
        let highlightedShopIdx = -1; // index in filteredData of highlighted shop
        
        const CITY_COORDS = {
            shiroyama: { x: 3313, z: 4913 },
            orakuru: { x: 3614, z: 6985 }
        };
        
        // Image cache for exchange icons on canvas
        const iconImageCache = new Map();
        let pinnedCluster = null; // cluster pinned to sidebar
        
        function switchView(view) {
            currentView = view;
            const tableView = document.getElementById('table-view');
            const mapView = document.getElementById('map-view');
            const tableBtn = document.getElementById('table-view-btn');
            const mapBtn = document.getElementById('map-view-btn');
            
            if (view === 'table') {
                tableView.classList.remove('hidden');
                mapView.classList.add('hidden');
                tableBtn.classList.add('active');
                mapBtn.classList.remove('active');
                removeSearchHint();
            } else {
                tableView.classList.add('hidden');
                mapView.classList.remove('hidden');
                tableBtn.classList.remove('active');
                mapBtn.classList.add('active');
                if (!mapInitialized) {
                    initMap();
                    mapInitialized = true;
                }
                renderMapSidebar();
                requestAnimationFrame(() => {
                    resizeMapCanvas();
                    renderMap();
                });
                // Show search hint on first map view
                initSearchHint();
            }
            updateURL();
            feather.replace();
        }
        
        function initMap() {
            mapContainer2 = document.getElementById('shop-map-container');
            mapTileLayer = document.getElementById('shop-tile-layer');
            mapCanvas = document.getElementById('shop-map-canvas');
            mapCtx = mapCanvas.getContext('2d');
            
            resizeMapCanvas();
            setupMapEvents();
            renderMap();
            
            window.addEventListener('resize', () => {
                if (currentView === 'map') {
                    resizeMapCanvas();
                    renderMap();
                }
            });
        }
        
        function resizeMapCanvas() {
            if (!mapContainer2) return;
            const rect = mapContainer2.getBoundingClientRect();
            mapCanvas.width = rect.width;
            mapCanvas.height = rect.height;
        }
        
        function mapGetScale() {
            return 1 / Math.pow(2, -mapZoomLevel);
        }
        
        function mapWorldToScreen(wx, wz) {
            const s = mapGetScale();
            return {
                x: (wx - mapViewX) * s + mapCanvas.width / 2,
                y: (wz - mapViewZ) * s + mapCanvas.height / 2
            };
        }
        
        function mapScreenToWorld(sx, sy) {
            const s = mapGetScale();
            return {
                x: (sx - mapCanvas.width / 2) / s + mapViewX,
                z: (sy - mapCanvas.height / 2) / s + mapViewZ
            };
        }
        
        function mapGetTileCoords(wx, wz) {
            const bpt = TILE_SIZE * Math.pow(2, -mapZoomLevel);
            return { x: Math.floor(wx / bpt), z: Math.floor(wz / bpt) };
        }
        
        function mapGetTileWorldPos(tx, tz) {
            const bpt = TILE_SIZE * Math.pow(2, -mapZoomLevel);
            return { x: tx * bpt, z: tz * bpt };
        }
        
        function mapGetTileUrl(tx, tz, zoom) {
            return `https://civmc-map.duckdns.org/tiles/terrain/z${zoom}/${tx},${tz}.png`;
        }
        
        function renderMap() {
            renderMapTiles();
            preloadAndRender();
        }
        
        // Clamp tile zoom to the max available on the server (z0)
        function getClampedTileZoom() {
            return Math.min(0, mapZoomLevel);
        }
        
        function renderMapTiles() {
            if (!mapContainer2) return;
            const rect = mapContainer2.getBoundingClientRect();
            const w = rect.width, h = rect.height;
            const scale = mapGetScale();
            // Use clamped zoom for tile fetching - tiles only go up to z0
            const tileZoom = getClampedTileZoom();
            const bpt = TILE_SIZE * Math.pow(2, -tileZoom); // blocks per tile at tile zoom
            
            const topLeft = mapScreenToWorld(0, 0);
            const bottomRight = mapScreenToWorld(w, h);
            
            const startTileX = Math.floor(topLeft.x / bpt) - 1;
            const startTileZ = Math.floor(topLeft.z / bpt) - 1;
            const endTileX = Math.floor(bottomRight.x / bpt) + 1;
            const endTileZ = Math.floor(bottomRight.z / bpt) + 1;
            
            const visibleKeys = new Set();
            // Screen size of each tile (blocks-per-tile * pixels-per-block)
            const tileScreenSize = bpt * scale;
            
            for (let tz = startTileZ; tz <= endTileZ; tz++) {
                for (let tx = startTileX; tx <= endTileX; tx++) {
                    const key = `${tileZoom}/${tx},${tz}`;
                    visibleKeys.add(key);
                    
                    const worldX = tx * bpt;
                    const worldZ = tz * bpt;
                    const screen = mapWorldToScreen(worldX, worldZ);
                    
                    let img = mapTileElements.get(key);
                    if (!img) {
                        img = document.createElement('img');
                        img.src = mapGetTileUrl(tx, tz, tileZoom);
                        img.style.position = 'absolute';
                        img.style.imageRendering = 'pixelated';
                        img.style.opacity = '0.45';
                        img.onerror = () => { img.style.display = 'none'; };
                        img.onload = () => { img.style.display = 'block'; };
                        mapTileLayer.appendChild(img);
                        mapTileElements.set(key, img);
                    }
                    
                    img.style.left = Math.round(screen.x) + 'px';
                    img.style.top = Math.round(screen.y) + 'px';
                    img.style.width = Math.ceil(tileScreenSize + 1) + 'px';
                    img.style.height = Math.ceil(tileScreenSize + 1) + 'px';
                }
            }
            
            for (const [key, img] of mapTileElements) {
                if (!visibleKeys.has(key)) {
                    img.remove();
                    mapTileElements.delete(key);
                }
            }
        }
        
        // Build clusters from filteredData based on coords
        function buildClusters() {
            const scale = mapGetScale();
            const points = [];
            
            // Compute cluster radius from actual rendered box size so boxes never overlap
            const iconSize = Math.max(8, Math.min(14, 8 + (mapZoomLevel + 6) * 0.75));
            const arrowWidth = Math.max(4, iconSize * 0.3);
            const boxWidth = iconSize * 2 + arrowWidth + 8 + 6; // includes padding
            const rowHeight = iconSize + 2;
            const clusterRadius = Math.max(boxWidth * 0.85, rowHeight * 2, 36);
            
            filteredData.forEach((row, idx) => {
                const originalIndex = processedData.indexOf(row);
                const originalRow = shopData[originalIndex];
                const coordStr = row[5] || '';
                const parts = coordStr.split(',').map(c => parseFloat(c.trim()));
                if (parts.length < 3 || isNaN(parts[0]) || isNaN(parts[2])) return;
                
                const wx = parts[0], wz = parts[2];
                const screen = mapWorldToScreen(wx, wz);
                
                points.push({
                    wx, wz,
                    sx: screen.x, sy: screen.y,
                    row, originalRow, originalIndex, filteredIdx: idx,
                    input: row[1], output: row[3],
                    inputLore: originalRow[2] || '',
                    outputLore: originalRow[4] || '',
                    inputRaw: originalRow[1],
                    outputRaw: originalRow[3],
                    contact: row[9] || '',
                    city: row[7] || ''
                });
            });
            
            // Multi-pass clustering to catch chains of nearby points
            const clusters = [];
            const assigned = new Set();
            
            for (let i = 0; i < points.length; i++) {
                if (assigned.has(i)) continue;
                const cluster = { items: [points[i]], cx: points[i].sx, cy: points[i].sy, wx: points[i].wx, wz: points[i].wz };
                assigned.add(i);
                
                // Multiple passes: keep scanning until no new points are absorbed
                let changed = true;
                while (changed) {
                    changed = false;
                    for (let j = 0; j < points.length; j++) {
                        if (assigned.has(j)) continue;
                        const dx = points[j].sx - cluster.cx;
                        const dy = points[j].sy - cluster.cy;
                        if (Math.sqrt(dx*dx + dy*dy) < clusterRadius) {
                            cluster.items.push(points[j]);
                            assigned.add(j);
                            // Recompute center
                            cluster.cx = cluster.items.reduce((s,p) => s+p.sx, 0) / cluster.items.length;
                            cluster.cy = cluster.items.reduce((s,p) => s+p.sy, 0) / cluster.items.length;
                            changed = true;
                        }
                    }
                }
                clusters.push(cluster);
            }
            
            return clusters;
        }
        
        function loadIconImage(url) {
            if (iconImageCache.has(url)) return iconImageCache.get(url);
            const img = new Image();
            img.src = url;
            const promise = new Promise(resolve => {
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
            });
            iconImageCache.set(url, promise);
            return promise;
        }
        
        let clustersCache = [];
        
        // Resolved icon image cache for canvas drawing
        const resolvedIcons = new Map();
        
        function preloadAndRender() {
            const promises = [];
            filteredData.forEach((row, idx) => {
                const origIdx = processedData.indexOf(row);
                const origRow = shopData[origIdx];
                const inUrl = getItemIconUrl(origRow[1], origRow[2] || '');
                const outUrl = getItemIconUrl(origRow[3], origRow[4] || '');
                if (inUrl) {
                    const p = loadIconImage(inUrl).then(img => { if(img) resolvedIcons.set(inUrl, img); });
                    promises.push(p);
                }
                if (outUrl) {
                    const p = loadIconImage(outUrl).then(img => { if(img) resolvedIcons.set(outUrl, img); });
                    promises.push(p);
                }
            });
            Promise.all(promises).then(() => renderMapPointsFinal());
        }
        
        function renderMapPointsFinal() {
            if (!mapCtx) return;
            const w = mapCanvas.width, h = mapCanvas.height;
            mapCtx.clearRect(0, 0, w, h);
            
            const clusters = buildClusters();
            clustersCache = clusters;
            const scale = mapGetScale();
            const iconSize = Math.max(8, Math.min(14, 8 + (mapZoomLevel + 6) * 0.75));
            const arrowWidth = Math.max(4, iconSize * 0.3);
            
            clusters.forEach(cluster => {
                const cx = cluster.cx, cy = cluster.cy;
                if (cx < -60 || cx > w + 60 || cy < -60 || cy > h + 60) return;
                
                const itemCount = cluster.items.length;
                const maxVisible = Math.min(itemCount, 4);
                const rowHeight = iconSize + 2;
                const totalHeight = maxVisible * rowHeight;
                const boxWidth = iconSize * 2 + arrowWidth + 8;
                const boxX = cx - boxWidth / 2;
                const boxY = cy - totalHeight / 2;
                
                // Background pill
                mapCtx.fillStyle = 'rgba(17, 24, 39, 0.88)';
                mapCtx.strokeStyle = itemCount > 1 ? '#2596be' : '#4b5563';
                mapCtx.lineWidth = 1;
                const br = 5;
                mapCtx.beginPath();
                mapCtx.roundRect(boxX - 3, boxY - 3, boxWidth + 6, totalHeight + 6, br);
                mapCtx.fill();
                mapCtx.stroke();
                
                // Store hitbox for hover detection
                cluster.hitBox = {
                    x: boxX - 3, y: boxY - 3,
                    w: boxWidth + 6, h: totalHeight + 6
                };
                
                // Badge
                if (itemCount > 1) {
                    const badgeX = boxX + boxWidth + 2;
                    const badgeY = boxY - 4;
                    const txt = String(itemCount);
                    mapCtx.font = 'bold 8px sans-serif';
                    const tw = mapCtx.measureText(txt).width;
                    const bw = Math.max(14, tw + 6);
                    mapCtx.fillStyle = '#2596be';
                    mapCtx.beginPath();
                    mapCtx.roundRect(badgeX, badgeY, bw, 13, 7);
                    mapCtx.fill();
                    mapCtx.fillStyle = 'white';
                    mapCtx.textAlign = 'center';
                    mapCtx.textBaseline = 'middle';
                    mapCtx.fillText(txt, badgeX + bw/2, badgeY + 6.5);
                }
                
                for (let vi = 0; vi < maxVisible; vi++) {
                    const item = cluster.items[vi];
                    const ry = boxY + vi * rowHeight;
                    
                    const inUrl = getItemIconUrl(item.inputRaw, item.inputLore);
                    const outUrl = getItemIconUrl(item.outputRaw, item.outputLore);
                    
                    // Input icon
                    const inImg = resolvedIcons.get(inUrl);
                    if (inImg) {
                        mapCtx.imageSmoothingEnabled = false;
                        mapCtx.drawImage(inImg, boxX, ry, iconSize, iconSize);
                    } else {
                        mapCtx.fillStyle = '#374151';
                        mapCtx.fillRect(boxX, ry, iconSize, iconSize);
                    }
                    
                    // Arrow
                    const arrowX = boxX + iconSize + 2;
