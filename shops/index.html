                    const arrowY = ry + iconSize / 2;
                    mapCtx.strokeStyle = '#9ca3af';
                    mapCtx.lineWidth = 1.5;
                    mapCtx.beginPath();
                    mapCtx.moveTo(arrowX, arrowY);
                    mapCtx.lineTo(arrowX + arrowWidth, arrowY);
                    mapCtx.stroke();
                    mapCtx.fillStyle = '#9ca3af';
                    mapCtx.beginPath();
                    mapCtx.moveTo(arrowX + arrowWidth, arrowY);
                    mapCtx.lineTo(arrowX + arrowWidth - 4, arrowY - 3);
                    mapCtx.lineTo(arrowX + arrowWidth - 4, arrowY + 3);
                    mapCtx.fill();
                    
                    // Output icon
                    const outImg = resolvedIcons.get(outUrl);
                    if (outImg) {
                        mapCtx.imageSmoothingEnabled = false;
                        mapCtx.drawImage(outImg, boxX + iconSize + arrowWidth + 6, ry, iconSize, iconSize);
                    } else {
                        mapCtx.fillStyle = '#374151';
                        mapCtx.fillRect(boxX + iconSize + arrowWidth + 6, ry, iconSize, iconSize);
                    }
                }
                
                // Highlight ring if this cluster contains the highlighted shop
                if (highlightedShopIdx >= 0) {
                    const isHighlighted = cluster.items.some(item => item.filteredIdx === highlightedShopIdx);
                    if (isHighlighted) {
                        mapCtx.save();
                        mapCtx.strokeStyle = '#2596be';
                        mapCtx.lineWidth = 2.5;
                        mapCtx.shadowColor = '#2596be';
                        mapCtx.shadowBlur = 12;
                        mapCtx.beginPath();
                        mapCtx.roundRect(boxX - 6, boxY - 6, boxWidth + 12, totalHeight + 12, br + 3);
                        mapCtx.stroke();
                        mapCtx.restore();
                    }
                }
                
                // Overflow indicator
                if (itemCount > maxVisible) {
                    mapCtx.fillStyle = '#9ca3af';
                    mapCtx.font = '8px sans-serif';
                    mapCtx.textAlign = 'center';
                    mapCtx.textBaseline = 'top';
                    mapCtx.fillText(`+${itemCount - maxVisible} more`, cx, boxY + totalHeight + 4);
                }
            });
        }
        
        function setupMapEvents() {
            // Panning
            let mapMouseDownX, mapMouseDownY;
            mapCanvas.addEventListener('mousedown', e => {
                mapIsPanning = true;
                mapPanStartX = e.clientX;
                mapPanStartY = e.clientY;
                mapMouseDownX = e.clientX;
                mapMouseDownY = e.clientY;
                mapPanStartViewX = mapViewX;
                mapPanStartViewZ = mapViewZ;
                mapCanvas.style.cursor = 'grabbing';
            });
            
            window.addEventListener('mousemove', e => {
                if (mapIsPanning) {
                    const dx = e.clientX - mapPanStartX;
                    const dy = e.clientY - mapPanStartY;
                    const s = mapGetScale();
                    mapViewX = mapPanStartViewX - dx / s;
                    mapViewZ = mapPanStartViewZ - dy / s;
                    renderMap();
                }
                
                // Coords display
                if (currentView === 'map' && mapCanvas) {
                    const rect = mapCanvas.getBoundingClientRect();
                    const sx = e.clientX - rect.left;
                    const sy = e.clientY - rect.top;
                    if (sx >= 0 && sx <= rect.width && sy >= 0 && sy <= rect.height) {
                        const world = mapScreenToWorld(sx, sy);
                        document.getElementById('map-coords-display').textContent = `${Math.round(world.x)}, ${Math.round(world.z)}`;
                        
                        // Check hover on clusters
                        if (!mapIsPanning) {
                            checkMapHover(sx, sy, e.clientX, e.clientY);
                        }
                    }
                }
            });
            
            window.addEventListener('mouseup', e => {
                if (mapIsPanning) {
                    const dragDist = Math.hypot(e.clientX - mapMouseDownX, e.clientY - mapMouseDownY);
                    mapIsPanning = false;
                    mapCanvas.style.cursor = 'grab';
                    // If it was a click (not a drag), check for cluster pin
                    if (dragDist < 5) {
                        const rect = mapCanvas.getBoundingClientRect();
                        const sx = e.clientX - rect.left;
                        const sy = e.clientY - rect.top;
                        let clicked = null;
                        for (const cluster of clustersCache) {
                            if (!cluster.hitBox) continue;
                            const hb = cluster.hitBox;
                            if (sx >= hb.x && sx <= hb.x + hb.w && sy >= hb.y && sy <= hb.y + hb.h) {
                                clicked = cluster;
                                break;
                            }
                        }
                        if (clicked) {
                            pinClusterToSidebar(clicked);
                        }
                    }
                }
            });
            
            // Zooming
            mapCanvas.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = mapCanvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const worldBefore = mapScreenToWorld(mx, my);
                
                const delta = e.deltaY > 0 ? -1 : 1;
                mapZoomLevel = Math.max(MAP_MIN_ZOOM, Math.min(MAP_MAX_ZOOM, mapZoomLevel + delta));
                
                const worldAfter = mapScreenToWorld(mx, my);
                mapViewX -= (worldAfter.x - worldBefore.x);
                mapViewZ -= (worldAfter.z - worldBefore.z);
                
                renderMap();
            }, { passive: false });
            
            // Touch events for mobile
            let lastTouchDist = 0;
            mapCanvas.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    mapIsPanning = true;
                    mapPanStartX = e.touches[0].clientX;
                    mapPanStartY = e.touches[0].clientY;
                    mapPanStartViewX = mapViewX;
                    mapPanStartViewZ = mapViewZ;
                } else if (e.touches.length === 2) {
                    lastTouchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: true });
            
            mapCanvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches.length === 1 && mapIsPanning) {
                    const dx = e.touches[0].clientX - mapPanStartX;
                    const dy = e.touches[0].clientY - mapPanStartY;
                    const s = mapGetScale();
                    mapViewX = mapPanStartViewX - dx / s;
                    mapViewZ = mapPanStartViewZ - dy / s;
                    renderMap();
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (lastTouchDist > 0) {
                        const delta = dist > lastTouchDist ? 1 : -1;
                        if (Math.abs(dist - lastTouchDist) > 30) {
                            mapZoomLevel = Math.max(MAP_MIN_ZOOM, Math.min(MAP_MAX_ZOOM, mapZoomLevel + delta));
                            lastTouchDist = dist;
                            renderMap();
                        }
                    }
                }
            }, { passive: false });
            
            mapCanvas.addEventListener('touchend', () => {
                mapIsPanning = false;
                lastTouchDist = 0;
            });
            
            // Hide tooltip on mouse leave (with delay for hover transition)
            mapCanvas.addEventListener('mouseleave', () => {
                const tooltip = document.getElementById('map-exchange-tooltip');
                if (!tooltip.classList.contains('pinned')) {
                    clearTimeout(tooltipHideTimer);
                    tooltipHideTimer = setTimeout(() => {
                        if (!tooltip.classList.contains('pinned')) {
                            tooltip.style.display = 'none';
                            mapHoveredCluster = null;
                        }
                    }, 200);
                }
            });
            
            // Tooltip hover handlers for seamless scrolling
            const tooltipEl = document.getElementById('map-exchange-tooltip');
            tooltipEl.addEventListener('mouseenter', () => {
                clearTimeout(tooltipHideTimer);
                tooltipEl.classList.add('pinned');
            });
            tooltipEl.addEventListener('mouseleave', () => {
                tooltipEl.classList.remove('pinned');
                clearTimeout(tooltipHideTimer);
                tooltipHideTimer = setTimeout(() => {
                    tooltipEl.style.display = 'none';
                    mapHoveredCluster = null;
                }, 200);
            });
            
            // Keyboard scroll for tooltip (W/Up = scroll up, S/Down = scroll down)
            window.addEventListener('keydown', e => {
                const tt = document.getElementById('map-exchange-tooltip');
                if (!tt || tt.style.display === 'none') return;
                const body = tt.querySelector('.tooltip-body');
                if (!body) return;
                const key = e.key;
                const scrollAmt = 40;
                if (key === 'w' || key === 'W' || key === 'ArrowUp') {
                    e.preventDefault();
                    body.scrollTop -= scrollAmt;
                } else if (key === 's' || key === 'S' || key === 'ArrowDown') {
                    e.preventDefault();
                    body.scrollTop += scrollAmt;
                }
            });
        }
        
        let tooltipHideTimer = null;
        
        function checkMapHover(sx, sy, clientX, clientY) {
            const tooltip = document.getElementById('map-exchange-tooltip');
            if (tooltip.classList.contains('pinned')) return; // Don't change while hovering tooltip
            
            let found = null;
            
            for (const cluster of clustersCache) {
                if (!cluster.hitBox) continue;
                const hb = cluster.hitBox;
                if (sx >= hb.x && sx <= hb.x + hb.w && sy >= hb.y && sy <= hb.y + hb.h) {
                    found = cluster;
                    break;
                }
            }
            
            if (!found) {
                clearTimeout(tooltipHideTimer);
                tooltipHideTimer = setTimeout(() => {
                    if (!tooltip.classList.contains('pinned')) {
                        tooltip.style.display = 'none';
                        mapHoveredCluster = null;
                    }
                }, 200);
                return;
            }
            
            clearTimeout(tooltipHideTimer);
            
            if (mapHoveredCluster === found) {
                positionTooltip(tooltip, clientX, clientY);
                return;
            }
            
            mapHoveredCluster = found;
            const items = found.items;
            const needsScroll = items.length > 4;
            
            let html = `<div class="tooltip-header">`;
            html += `<span>${items.length} exchange${items.length > 1 ? 's' : ''} <span style="color:#6b7280;font-size:0.6rem">· Click to pin on left side</span></span>`;
            html += `</div>`;
            html += `<div class="tooltip-body">`;
            
            items.forEach(item => {
                const inUrl = getItemIconUrl(item.inputRaw, item.inputLore) || '';
                const outUrl = getItemIconUrl(item.outputRaw, item.outputLore) || '';
                const itemCoords = `${Math.round(item.wx)}, ${Math.round(item.wz)}`;
                html += `<div class="tooltip-exchange-row">`;
                html += `<span class="exchange-coords">${itemCoords}</span>`;
                if (inUrl) html += `<img src="${inUrl}" onerror="this.style.display='none'">`;
                html += `<span class="exchange-text">${escapeHtml(item.input)}</span>`;
                html += `<span class="arrow">→</span>`;
                if (outUrl) html += `<img src="${outUrl}" onerror="this.style.display='none'">`;
                html += `<span class="exchange-text">${escapeHtml(item.output)}</span>`;
                html += `</div>`;
            });
            
            html += `</div>`;
            if (needsScroll) {
                html += `<div class="tooltip-scroll-hint">Scroll ↑ (W / Up Arrow) &nbsp;·&nbsp; Scroll ↓ (S / Down Arrow)</div>`;
            }
            
            tooltip.innerHTML = html;
            tooltip.style.display = 'block';
            tooltip.classList.remove('pinned');
            positionTooltip(tooltip, clientX, clientY);
        }
        
        // Dismiss tooltip on click outside
        document.addEventListener('click', e => {
            const tooltip = document.getElementById('map-exchange-tooltip');
            if (!tooltip || tooltip.style.display === 'none') return;
            if (tooltip.contains(e.target)) return;
            tooltip.classList.remove('pinned');
            tooltip.style.display = 'none';
            mapHoveredCluster = null;
        });
        
        function positionTooltip(tooltip, cx, cy) {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            let left = cx + 16;
            let top = cy - 20;
            
            // Ensure it doesn't go off-screen
            const rect = tooltip.getBoundingClientRect();
            if (left + 300 > vw) left = cx - 300 - 16;
            if (top + 280 > vh) top = vh - 290;
            if (top < 10) top = 10;
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function mapGoToCity(city) {
            mapCurrentCity = city;
            const coords = CITY_COORDS[city];
            mapViewX = coords.x;
            mapViewZ = coords.z;
            mapZoomLevel = MAP_CITY_ZOOM;
            
            // Update toggle buttons
            document.getElementById('map-shiroyama-btn').classList.toggle('active', city === 'shiroyama');
            document.getElementById('map-orakuru-btn').classList.toggle('active', city === 'orakuru');
            
            renderMap();
        }
        
        function mapZoom(delta) {
            mapZoomLevel = Math.max(MAP_MIN_ZOOM, Math.min(MAP_MAX_ZOOM, mapZoomLevel + delta));
            renderMap();
        }
        
        function renderMapSidebar() {
            const list = document.getElementById('sidebar-list');
            const count = document.getElementById('sidebar-count');
            list.innerHTML = '';
            
            // If a cluster is pinned, show pinned view
            if (pinnedCluster) {
                const items = pinnedCluster.items;
                count.textContent = items.length + ' pinned';
                
                // Pinned header with clear button
                const header = document.createElement('div');
                header.className = 'sidebar-pinned-header';
                header.innerHTML = `<span>📌 ${items.length} Pinned Exchange${items.length > 1 ? 's' : ''}</span>`;
                const clearBtn = document.createElement('button');
                clearBtn.className = 'sidebar-clear-btn';
                clearBtn.textContent = '✕ Clear';
                clearBtn.addEventListener('click', () => {
                    pinnedCluster = null;
                    renderMapSidebar();
                });
                header.appendChild(clearBtn);
                list.appendChild(header);
                
                items.forEach(item => {
                    const filtIdx = filteredData.indexOf(item.row);
                    const div = buildSidebarItem(item.row, item.originalRow, item.originalIndex, true, filtIdx);
                    list.appendChild(div);
                });
                
                feather.replace();
                return;
            }
            
            count.textContent = filteredData.length;
            
            filteredData.forEach((row, idx) => {
                const origIdx = processedData.indexOf(row);
                const origRow = shopData[origIdx];
                const div = buildSidebarItem(row, origRow, origIdx, false, idx);
                list.appendChild(div);
            });
            
            feather.replace();
        }
        
        function buildSidebarItem(row, origRow, origIdx, isPinned, filteredIdx) {
            const inputLore = origRow[2] || '';
            const outputLore = origRow[4] || '';
            const { loreContent: inLore } = processItemWithLore(origRow[1], inputLore);
            const { loreContent: outLore } = processItemWithLore(origRow[3], outputLore);
            
            const div = document.createElement('div');
            div.className = 'sidebar-item';
            div.style.flexDirection = 'column';
            div.style.alignItems = 'stretch';
            div.style.gap = '2px';
            
            // Top row with icons and names
            const topRow = document.createElement('div');
            topRow.className = 'sidebar-item-row';
            
            // Input icon
            const inUrl = getItemIconUrl(origRow[1], inputLore);
            if (inUrl) {
                const img = document.createElement('img');
                img.src = inUrl;
                img.className = 'item-icon';
                img.style.imageRendering = 'pixelated';
                img.onerror = function() { this.style.display = 'none'; };
                topRow.appendChild(img);
            }
            
            // Input name
            const inName = document.createElement('span');
            inName.className = 'sidebar-item-name';
            inName.textContent = row[1];
            inName.style.flex = '0 1 auto';
            topRow.appendChild(inName);
            
            // Input lore icon (right next to input name)
            if (inLore && inLore.trim()) {
                const inBook = document.createElement('span');
                inBook.className = 'sidebar-lore-icon';
                inBook.innerHTML = '<i data-feather="book-open" class="w-3 h-3"></i>';
                inBook.addEventListener('mouseenter', (e) => {
                    showLorePopover(e, inLore, '', row[1], '');
                });
                inBook.addEventListener('mouseleave', () => { hideLorePopover(); });
                topRow.appendChild(inBook);
            }
            
            // Arrow
            const arrow = document.createElement('span');
            arrow.textContent = '→';
            arrow.style.color = '#6b7280';
            arrow.style.flexShrink = '0';
            topRow.appendChild(arrow);
            
            // Output icon
            const outUrl = getItemIconUrl(origRow[3], outputLore);
            if (outUrl) {
                const img = document.createElement('img');
                img.src = outUrl;
                img.className = 'item-icon';
                img.style.imageRendering = 'pixelated';
                img.onerror = function() { this.style.display = 'none'; };
                topRow.appendChild(img);
            }
            
            // Output name
            const outName = document.createElement('span');
            outName.className = 'sidebar-item-name';
            outName.textContent = row[3];
            outName.style.flex = '1';
            topRow.appendChild(outName);
            
            // Output lore icon (right next to output name)
            if (outLore && outLore.trim()) {
                const outBook = document.createElement('span');
                outBook.className = 'sidebar-lore-icon';
                outBook.innerHTML = '<i data-feather="book-open" class="w-3 h-3"></i>';
                outBook.addEventListener('mouseenter', (e) => {
                    showLorePopover(e, '', outLore, '', row[3]);
                });
                outBook.addEventListener('mouseleave', () => { hideLorePopover(); });
                topRow.appendChild(outBook);
            }
            
            div.appendChild(topRow);
            
            const coordStr = row[5] || '';
            const parts = coordStr.split(',').map(c => parseFloat(c.trim()));
            
            // Show coords as subtext for pinned items
            if (isPinned && parts.length >= 3 && !isNaN(parts[0])) {
                const subtext = document.createElement('div');
                subtext.className = 'sidebar-item-subtext';
                subtext.textContent = `${Math.round(parts[0])}, ${Math.round(parts[2])}`;
                div.appendChild(subtext);
            }
            
            // Click to pan + highlight
            div.addEventListener('click', () => {
                if (parts.length >= 3 && !isNaN(parts[0]) && !isNaN(parts[2])) {
                    mapViewX = parts[0];
                    mapViewZ = parts[2];
                    mapZoomLevel = MAP_MAX_ZOOM;
                    highlightedShopIdx = filteredIdx >= 0 ? filteredIdx : -1;
                    renderMap();
                }
                document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('highlighted'));
                div.classList.add('highlighted');
            });
            
            return div;
        }
        
        function pinClusterToSidebar(cluster) {
            pinnedCluster = cluster;
            renderMapSidebar();
        }
        
        // Lore popover management
        let lorePopoverEl = null;
        
        function showLorePopover(event, inLore, outLore, inputName, outputName) {
            hideLorePopover();
            
            const popover = document.createElement('div');
            popover.className = 'lore-popover';
            
            let html = '<div class="lore-popover-header">Item Details</div>';
            
            if (inLore && inLore.trim()) {
                html += `<div class="lore-section">`;
                html += `<div class="lore-section-label">${escapeHtml(inputName)}</div>`;
                html += `<div>${escapeHtml(inLore.trim())}</div>`;
                html += `</div>`;
            }
            if (outLore && outLore.trim()) {
                html += `<div class="lore-section">`;
                html += `<div class="lore-section-label">${escapeHtml(outputName)}</div>`;
                html += `<div>${escapeHtml(outLore.trim())}</div>`;
                html += `</div>`;
            }
            
            popover.innerHTML = html;
            document.body.appendChild(popover);
            lorePopoverEl = popover;
            
            // Position near the book icon
            const rect = event.target.closest('.sidebar-lore-icon').getBoundingClientRect();
            let left = rect.right + 8;
            let top = rect.top - 10;
            
            // If it would go off-screen right, show on left
            if (left + 320 > window.innerWidth) {
                left = rect.left - 328;
            }
            if (top + 220 > window.innerHeight) {
                top = window.innerHeight - 230;
            }
            if (top < 10) top = 10;
            
            popover.style.left = left + 'px';
            popover.style.top = top + 'px';
        }
        
        function hideLorePopover() {
            if (lorePopoverEl) {
                lorePopoverEl.remove();
                lorePopoverEl = null;
            }
        }
        
        // Re-render map when filters change
        function onFilterChange() {
            if (currentView === 'map' && mapInitialized) {
                pinnedCluster = null; // clear pinned on filter change
                renderMapSidebar();
                preloadAndRender();
            }
        }
        
        // ==================== SEARCH HINT TOOLTIP ====================
        let _hintRepositionFn = null; // stored so we can clean up listeners

        // Temporarily remove the hint (e.g. when switching to table) without permanently dismissing
        function removeSearchHint() {
            const el = document.getElementById('search-hint');
            if (el) el.remove();
            if (_hintRepositionFn) {
                window.removeEventListener('scroll', _hintRepositionFn);
                window.removeEventListener('resize', _hintRepositionFn);
                _hintRepositionFn = null;
            }
        }

        function initSearchHint() {
            if (localStorage.getItem('shopSearchHintDismissed')) return;
            if (document.getElementById('search-hint')) return; // already showing
            
            const searchInput = document.getElementById('search-input');
            if (!searchInput) return;
            
            const searchBar = searchInput.closest('.relative');
            if (!searchBar) return;
            
            // Curved arrow SVG (arrow curves down to point at search bar below)
            const arrowW = 60;
            const arrowH = 62;
            const arrowSvg = `<svg class="onboarding-arrow-svg" width="${arrowW}" height="${arrowH}" viewBox="0 0 ${arrowW} ${arrowH}" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M${arrowW - 5} 8 C${arrowW * 0.4} 8, ${arrowW * 0.15} ${arrowH * 0.45}, ${arrowW * 0.15} ${arrowH - 8}" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
                <path d="M${arrowW * 0.15 - 5} ${arrowH - 17} L${arrowW * 0.15} ${arrowH - 5} L${arrowW * 0.15 + 5} ${arrowH - 17}" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
            </svg>`;
            
            // Create the hint element
            const hint = document.createElement('div');
            hint.className = 'search-hint-tooltip';
            hint.id = 'search-hint';
            hint.style.flexDirection = 'column';
            hint.style.alignItems = 'flex-start';
            hint.innerHTML = `
                <span class="hint-text" style="margin-left:${arrowW + 4}px;margin-bottom:2px;">Search to filter map results</span>
                ${arrowSvg}
            `;
            
            document.body.appendChild(hint);
            
            // Position the tooltip above the search bar with arrow pointing down at it
            function repositionHint() {
                const rect = searchBar.getBoundingClientRect();
                const arrowTipX = arrowW * 0.15;
                const left = rect.left + rect.width * 0.10 - arrowTipX;
                hint.style.top = (rect.top - arrowH - 24) + 'px';
                hint.style.left = Math.max(4, left) + 'px';
            }
            _hintRepositionFn = repositionHint;
            repositionHint();
            
            window.addEventListener('scroll', repositionHint, { passive: true });
            window.addEventListener('resize', repositionHint, { passive: true });
            
            // Dismiss permanently on first search input
            const dismissHint = () => {
                removeSearchHint();
                localStorage.setItem('shopSearchHintDismissed', '1');
                searchInput.removeEventListener('input', dismissHint);
            };
            searchInput.addEventListener('input', dismissHint);
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            window.selectedSearchField = 'all';
        });

    </script>
</body>
