<!DOCTYPE html>
<html lang="en" class="dark">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nara Property Detail | Civ Homes</title>

    <meta name="description"
        content="View property detailed specifications, listed by owner details, coordinates, and interact with the 3D block schematic blueprints.">
    <meta name="theme-color" content="#FF6B35">
    <link class="page-icon" rel="icon" href="/images/nara_flag_white_border.svg" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js" defer></script>

    <link rel="stylesheet" href="/style.css" fetchpriority="high">

    <script type="importmap">
    {
        "imports": {

    <style>
        /* Premium Scrollbars */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #FF6B35, #A855F7, #06b6d4);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ff8558, #bd6eff, #22d3ee);
        }

        /* 3D Canvas styles */
        .schematic-canvas-container {
            width: 100%;
            height: 480px;
            position: relative;
            background: #040810;
            border-top: 1px solid rgba(255, 107, 53, 0.25);
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .item-icon {
            image-rendering: pixelated;
        }

        /* Unified Glowing Panel Design */
        .unified-panel {
            border: 1px solid rgba(255, 107, 53, 0.25);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(9, 13, 22, 0.95));
            box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.7), inset 0 0 35px rgba(255, 107, 53, 0.05);
        }

        /* Image Album Carousel (Optimized for Larger Display) */
        .album-container {
            position: relative;
            width: 100%;
            min-height: 480px;
            overflow: hidden;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-container img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s ease;
        }

        #dropdown-navigate[open] {
            position: relative;
            z-index: 50;
        }

        /* Force the details tag to allow visible overflow when open */
        #dropdown-navigate,
        #dropdown-navigate[open] {
            overflow: visible !important;
        }
/* Ensure the popover stays completely hidden until explicitly opened */
#navigate-options:not(:popover-open) {
    display: none !important;
}

/* Strip default browser popover styling overrides so it matches your dark theme */
#navigate-options {
    margin: 0;
    padding: 0;
    border: 1px solid rgba(51, 65, 85, 1); /* matches border-slate-700 */
    background-color: rgb(15, 23, 42);    /* matches bg-slate-900 */
}
        .album-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .album-arrow:hover {
            background: rgba(255, 107, 53, 0.7);
            border-color: rgba(255, 107, 53, 0.8);
            transform: translateY(-50%) scale(1.05);
        }

        .album-arrow.left {
            left: 16px;
        }

        .album-arrow.right {
            right: 16px;
        }

        .album-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .album-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .album-dot.active {
            background: #FF6B35;
            border-color: #FF6B35;
            box-shadow: 0 0 8px rgba(255, 107, 53, 0.6);
        }

        .album-counter {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            z-index: 10;
        }

        .nav-dropdown-menu button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-dropdown-menu button:hover {
            background: linear-gradient(90deg, rgba(255, 107, 53, 0.2), rgba(168, 85, 247, 0.2));
            color: #FF6B35;
            padding-left: 18px;
        }

        .directions-box {
            background: rgba(6, 182, 212, 0.06);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.65;
            color: #cbd5e1;
        }

        .directions-box strong {
            color: #22d3ee;
            font-weight: 800;
        }
    </style>

    <script src="/components/navbar.js" defer></script>
    <script src="/homes/view/rail-pathfinder.js" defer></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>

    <div class="h-[80px] flex-shrink-0"></div>

    <div id="details-container" class="flex-grow max-w-7xl mx-auto w-full px-6 py-8 flex flex-col gap-5">
        <div>
            <button onclick="navigateBack()"
                class="group flex items-center gap-2 text-sm text-slate-400 hover:text-white transition-colors py-2">
                <i data-feather="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                <span>Back to Listings</span>
            </button>
        </div>

        <div class="w-full rounded-2xl overflow-hidden flex flex-col lg:flex-row unified-panel">

            <div class="w-full lg:w-3/5 flex flex-col border-b lg:border-b-0 lg:border-r border-slate-800">
                <div id="detail-media-container" class="w-full overflow-hidden relative bg-slate-950">
                </div>

                <div id="schematic-section"
                    class="hidden flex flex-col w-full bg-slate-900/20 border-t border-slate-800">
                    <div class="px-6 py-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/40">
                        <div class="flex items-center gap-2">
                            <i data-feather="box" class="w-5 h-5 text-cyan-400"></i>
                            <h3 class="font-extrabold text-sm text-white uppercase tracking-wider">3D Schematic View
                            </h3>
                        </div>
                    </div>
                    <div class="schematic-canvas-container">
                        <canvas id="canvas"></canvas>
                        <div
                            class="absolute bottom-4 right-4 bg-slate-950/80 border border-slate-800/80 rounded-md px-3 py-1.5 text-[10px] text-slate-400 font-mono pointer-events-none flex items-center gap-3">
                            <span>🖱 Drag to Rotate</span>
                            <span>⚙ Scroll to Zoom</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-2/5 p-8 flex flex-col gap-6 bg-slate-900/40">

                <div class="flex justify-between items-start gap-4">
                    <div class="flex flex-row flex-wrap gap-2">
                        <span id="detail-badge"
                            class="text-[9px] font-bold uppercase tracking-wider px-3 py-1 rounded-full w-fit"></span>
                        <span id="detail-building-badge"
                            class="text-[9px] font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-slate-900 text-cyan-400 border border-cyan-800/30 w-fit"></span>
                    </div>
                    <div class="text-right flex-shrink-0">

                            class="text-[9px] text-slate-500 font-bold uppercase tracking-wider block mb-0.5">Price</span>
                        <span id="detail-price"
                            class="text-xl font-extrabold text-white flex items-center justify-end gap-1.5"></span>

                </div>

                <div class="border-t border-slate-800 pt-5 flex flex-col gap-2">
                    <h2 id="detail-address" class="text-3xl font-extrabold text-white tracking-tight"></h2>
                    <p id="detail-city" class="text-slate-400 flex items-center gap-1.5 text-sm font-semibold">

                    </p>

                <div class="grid grid-cols-2 gap-4 border-t border-slate-800 pt-5">
                    <div class="bg-slate-950/40 border border-slate-850 rounded-xl p-4 flex flex-col gap-1">
                        <span class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider block">Listed by</span>

                    </div>
                    <div class="bg-slate-950/40 border border-slate-850 rounded-xl p-4 flex flex-col gap-1">
                        <span
                            class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider block">Coordinates</span>
                        <span id="detail-coords-text" class="text-sm font-mono font-bold text-slate-200"></span>
                    </div>
                </div>

                <div class="flex flex-col gap-3 border-t border-slate-800 pt-5">
                    <button onclick="copyCoordsToClipboard()"
                        class="w-full py-3.5 bg-slate-850 hover:bg-slate-800 text-slate-200 font-bold rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-700 shadow-md select-none">
                        <i data-feather="copy" class="w-4 h-4 text-cyan-400"></i> Copy Coordinates
                    </button>
                    <a href="https://discord.gg/M8etHAEyBB" target="_blank"
                        class="w-full py-3.5 bg-slate-950 hover:bg-slate-900 text-orange-450 hover:text-white font-bold rounded-xl transition-all border border-orange-500/70 shadow-md flex items-center justify-center gap-2 select-none">
                        <i data-feather="message-square" class="w-4 h-4"></i> Contact an Agent
                    </a>
                </div>

                <div id="navigate-section" class="hidden flex flex-col gap-3 border-t border-slate-800 pt-5 pb-4 relative">
    <label class="text-xs text-cyan-400 font-extrabold uppercase tracking-wide ml-1">Navigate from</label>
    
    <div class="relative" id="dropdown-navigate">
        <button type="button" onclick="toggleNavigatePopover()" class="w-full flex justify-between items-center bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-full px-4 py-2.5 font-bold cursor-pointer hover:border-orange-400 transition-colors select-none">
            <span id="selected-navigate">Select a city...</span>
            <i data-feather="chevron-down" id="dropdown-arrow" class="w-3.5 h-3.5 text-orange-400 transition-transform"></i>
        </button>
        
        <div popover="manual" class="absolute bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-[9999] max-h-60 overflow-y-auto flex flex-col divide-y divide-slate-800/60 nav-dropdown-menu m-0 p-0" id="navigate-options">
        </div>
    </div>
    <div id="navigate-directions" class="hidden"></div>
</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SchematicRenderer } from "https://unpkg.com/schematic-renderer@1.1.23/dist/schematic-renderer.es.js";
        window.SchematicRendererClass = SchematicRenderer;
    </script>

    <script>
        let listing = null;
        let albumIndex = 0;
        let albumImages = [];
        let railPaths = [];

        const DIAMOND_ICON_URL = "https://ccvaults.com/assets/10.%20Items/11.%20Materials/Diamond.png";

        // Fast Coordinate Parser
        function parseCoordinates(coordStr) {
            if (!coordStr) return null;
            const parts = coordStr.replace(/[^\d\s-]/g, '').trim().split(/\s+/).map(Number);
            if (parts.length < 2 || parts.some(isNaN)) return null;
            return parts.length === 2 ? { x: parts[0], z: parts[1] } : { x: parts[0], y: parts[1], z: parts[2] };
        }

        function formatBuildingType(type) {
            if (!type) return 'Home';
            const lookup = { home: 'Home', apartment: 'Apartment', house_shop: 'House & Shop', hotel_room: 'Hotel Room' };
            return lookup[type.toLowerCase()] || type;
        }

        // Fetch Target Listing Data from Sanity CMS
        async function fetchListing(id) {
            const query = encodeURIComponent(`*[_type == "listingPost" && _id == "${id}"][0] {
                _id, address, coordinates, price, is_rental, city, listing_owner, building_type,
                "schematicUrl": schematic_file.asset->url,
                "images": images[].asset->url
            }`);

            try {
                const response = await fetch(`https://scdpub0o.apicdn.sanity.io/v2021-10-21/data/query/production?query=${query}`);
                if (!response.ok) return;

                const data = await response.json();
                listing = data.result;

                if (!listing) {
                    window.location.replace('/homes/');
                    return;
                }

                renderDetails();
            } catch (err) {
                console.error("Sanity connection skipped/failed: ", err);
            }
        }

        // Fast In-place Album State Mutations (High Performance Update)
        function updateAlbumDOM() {
            const img = document.getElementById('album-current-img');
            const counter = document.querySelector('.album-counter');
            const dots = document.querySelectorAll('.album-dot');

            if (img) img.src = albumImages[albumIndex];
            if (counter) counter.textContent = `${albumIndex + 1} / ${albumImages.length}`;

            dots.forEach((dot, idx) => {
                if (idx === albumIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function renderAlbum() {
            const mediaContainer = document.getElementById('detail-media-container');

            if (!albumImages || albumImages.length === 0) {
                const coords = parseCoordinates(listing.coordinates);
                mediaContainer.innerHTML = `
                <div class="h-[480px] bg-slate-950 flex flex-col items-center justify-center text-slate-500 gap-2">
                    <i data-feather="image" class="w-12 h-12 text-slate-800"></i>
                    <p class="font-mono text-[10px] font-bold text-slate-600">X: ${coords ? coords.x : '?'}, Z: ${coords ? coords.z : '?'}</p>
                    <p class="text-xs text-slate-600">No photos uploaded for this property blueprint yet.</p>
                </div>`;
                if (window.feather) feather.replace();
                return;
            }

            const hasMultiple = albumImages.length > 1;
            let html = `<div class="album-container"><img src="${albumImages[albumIndex]}" alt="Property Image" id="album-current-img">`;

            if (hasMultiple) {
                html += `
                <button class="album-arrow left" onclick="albumPrev()" aria-label="Previous image">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button class="album-arrow right" onclick="albumNext()" aria-label="Next image">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <span class="album-counter">${albumIndex + 1} / ${albumImages.length}</span>
                <div class="album-dots">`;

                albumImages.forEach((_, i) => {
                    html += `<span class="album-dot ${i === albumIndex ? 'active' : ''}" onclick="albumGoTo(${i})"></span>`;
                });
                html += `</div>`;
            }

            html += `</div>`;
            mediaContainer.innerHTML = html;
        }

        function albumPrev() {
            albumIndex = (albumIndex - 1 + albumImages.length) % albumImages.length;
            updateAlbumDOM();
        }
        function albumNext() {
            albumIndex = (albumIndex + 1) % albumImages.length;
            updateAlbumDOM();
        }
        function albumGoTo(i) {
            albumIndex = i;
            updateAlbumDOM();
        }

        function toggleNavigatePopover() {
    const popover = document.getElementById('navigate-options');
    const trigger = document.getElementById('dropdown-navigate');
    const arrow = document.getElementById('dropdown-arrow');
    
    if (popover.matches(':popover-open')) {
        popover.hidePopover();
        if (arrow) arrow.classList.remove('rotate-180');
    } else {
        // Dynamically calculate screen alignment so it floats precisely below the anchor box
        const rect = trigger.getBoundingClientRect();
        popover.style.top = `${rect.bottom + window.scrollY + 6}px`;
        popover.style.left = `${rect.left + window.scrollX}px`;
        popover.style.width = `${rect.width}px`;
        
        popover.showPopover();
        if (arrow) arrow.classList.add('rotate-180');
    }
}

function setupNavigateDropdown() {
    if (!listing || !listing.city || !window.RailPathfinder || railPaths.length === 0) return;

    const reachable = window.RailPathfinder.getReachableDepartures(listing.city, railPaths);
    if (reachable.length === 0) return;

    document.getElementById('navigate-section').classList.remove('hidden');
    const optionsContainer = document.getElementById('navigate-options');
    optionsContainer.innerHTML = '';

    const fragment = document.createDocumentFragment();
    reachable.forEach(city => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold';
        btn.textContent = city;
        btn.onclick = () => selectNavigateCity(city);
        fragment.appendChild(btn);
    });
    optionsContainer.appendChild(fragment);
}

function selectNavigateCity(city) {
    document.getElementById('selected-navigate').textContent = city;
    
    const popover = document.getElementById('navigate-options');
    const arrow = document.getElementById('dropdown-arrow');
    popover.hidePopover();
    if (arrow) arrow.classList.remove('rotate-180');

    const route = window.RailPathfinder.findRoute(city, listing.city, railPaths);
    const directionsEl = document.getElementById('navigate-directions');

    if (route && route.length > 0) {
        directionsEl.innerHTML = `<div class="directions-box">${window.RailPathfinder.generateDirections(route)}</div>`;
    } else {
        directionsEl.innerHTML = `<div class="directions-box text-slate-500">No route found from ${city} to ${listing.city}.</div>`;
    }
    directionsEl.classList.remove('hidden');
}

// Update the event listener at the bottom of your file to safely manage clicks outside the overlay
document.addEventListener('DOMContentLoaded', () => {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
        window.location.replace('/homes/');
        return;
    }

    document.addEventListener('click', (e) => {
        const popover = document.getElementById('navigate-options');
        const trigger = document.getElementById('dropdown-navigate');
        
        if (popover && popover.matches(':popover-open') && !trigger.contains(e.target) && !popover.contains(e.target)) {
            popover.hidePopover();
            const arrow = document.getElementById('dropdown-arrow');
            if (arrow) arrow.classList.remove('rotate-180');
        }
    });

    Promise.all([
        fetch('/data/rail_paths.json').then(r => r.ok ? r.json() : []).then(data => { railPaths = data; }).catch(() => {}),
        fetchListing(id)
    ]);
});

        function renderDetails() {
            const isRental = listing.is_rental;

            const badge = document.getElementById('detail-badge');
            badge.className = `text-[9px] font-bold uppercase tracking-wider px-3 py-1 rounded-full ${isRental ? 'bg-purple-950 text-purple-300 border border-purple-800' : 'bg-cyan-950 text-cyan-300 border border-cyan-800'}`;
            badge.textContent = isRental ? 'Rental Property' : 'For Sale';

            document.getElementById('detail-building-badge').textContent = formatBuildingType(listing.building_type);

            const detailPrice = document.getElementById('detail-price');
            if (listing.price === 0) {
                detailPrice.textContent = "Free";
            } else {
                detailPrice.innerHTML = `<img src="${DIAMOND_ICON_URL}" class="w-5 h-5 item-icon select-none inline-block align-middle"> <span>${listing.price}</span>`;
            }

            document.getElementById('detail-address').textContent = listing.address || 'Unnamed Property';
            document.getElementById('detail-city').querySelector('span').textContent = `${listing.city}`;
            document.getElementById('detail-owner').textContent = listing.listing_owner || 'Unknown';
            document.getElementById('detail-coords-text').textContent = listing.coordinates;

            albumImages = (listing.images && listing.images.length > 0) ? listing.images : [];
            albumIndex = 0;
            renderAlbum();

            window.activeMinecraftCoordinates = listing.coordinates;

            if (listing.schematicUrl && window.SchematicRendererClass) {
                document.getElementById('schematic-section').classList.remove('hidden');
                init3DRenderer(listing);
            } else {
                document.getElementById('schematic-section').classList.add('hidden');
            }

            setupNavigateDropdown();
            if (window.feather) feather.replace();
        }

        function init3DRenderer(listing) {
            const canvas = document.getElementById("canvas");
            const fileId = listing.address ? listing.address.replace(/\s+/g, '') : "house";

            try {
                new window.SchematicRendererClass(
                    canvas,
                    { [fileId]: async () => (await fetch(listing.schematicUrl)).arrayBuffer() },
                    { default: async () => (await fetch("https://dl.dropbox.com/scl/fi/6v6uqbfgedpi5n9gk2316/1.21.11-Template.zip?rlkey=mk8x5sp50uk7mk7hj554o4hfn&dl=1")).blob() },
                    {
                        enableDragAndDrop: true,
                        showGrid: true,
                        cameraOptions: { position: [20, 20, 20] },
                    }
                );

                setTimeout(() => window.dispatchEvent(new Event('resize')), 150);
            } catch (err) {
                console.error("Failed to initialize 3D Schematic Renderer canvas:", err);
            }
        }

        function copyCoordsToClipboard() {
            if (window.activeMinecraftCoordinates) {
                navigator.clipboard.writeText(window.activeMinecraftCoordinates).then(() => {
                    alert(`Coordinates "${window.activeMinecraftCoordinates}" copied to clipboard!`);
                }).catch(e => console.error("Clipboard copy failure:", e));
            }
        }

        function navigateBack() {
            window.location.href = '/homes/';
        }

        // Parallel Setup Event Listener
        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) {
                window.location.replace('/homes/');
                return;
            }

            // Close active dropdown panels upon container loss-of-focus
            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('dropdown-navigate');
                if (dropdown && !dropdown.contains(e.target)) dropdown.removeAttribute('open');
            });

            // Fire fetches asynchronously parallel for peak presentation speed
            Promise.all([
                fetch('/data/rail_paths.json').then(r => r.ok ? r.json() : []).then(data => { railPaths = data; }).catch(() => { }),
                fetchListing(id)
            ]);
        });
    </script>
</body>
