<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nara Homes | Civ-zillow</title>

    <meta name="description" content="Your future home is in Nara">
    <meta name="theme-color" content="#FF6B35">
    <link class="page-icon" rel="icon" href="/images/nara_flag_white_border.svg" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

    <script src="/components/navbar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="/style.css" fetchpriority="high">

    <style>
        /* Custom layout sizes to mimic Zillow */
        .portal-height {
            height: calc(100vh - 80px);
        }

        @media (max-width: 1024px) {
            .portal-height {
                height: auto;
            }
        }

        /* Premium Scrollbars */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #FF6B35, #A855F7, #06b6d4);
            border-radius: 4px;
            border: 2px solid rgba(15, 23, 42, 0.2);
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ff8558, #bd6eff, #22d3ee);
        }

        /* Leaflet Dark Customizations */
        .leaflet-container {
            background: #050811 !important;
            cursor: grab;
            font-family: inherit;
        }

        .leaflet-container:active {
            cursor: grabbing;
        }

        .leaflet-tile {
            opacity: 0.65;
            image-rendering: pixelated;
        }

        /* Modernized Leaflet Popup wrapper */
        .leaflet-popup-content-wrapper {
            background: rgba(9, 13, 22, 0.98) !important;
            backdrop-filter: blur(16px) !important;
            color: #f1f5f9 !important;
            border: 1px solid rgba(255, 107, 53, 0.5) !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9) !important;
            border-radius: 16px !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            line-height: inherit !important;
        }

        .leaflet-popup-tip {
            background: rgba(9, 13, 22, 0.98) !important;
            border-left: 1px solid rgba(255, 107, 53, 0.5) !important;
            border-bottom: 1px solid rgba(255, 107, 53, 0.5) !important;
        }

        /* High Contrast Visible Close Button */
        .leaflet-popup-close-button {
            color: #f1f5f9 !important;
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid rgba(255, 107, 53, 0.4) !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            top: 10px !important;
            right: 10px !important;
            font-size: 13px !important;
            padding: 0 0 1px 0 !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
            z-index: 5000 !important;
        }

        .leaflet-popup-close-button:hover {
            color: #ffffff !important;
            background: #FF6B35 !important;
            border-color: #FF6B35 !important;
            transform: scale(1.1);
        }

        /* Zillow Price markers styling (Accents: Orange for Sale, Purple for Rental) */
        .zillow-price-marker {
            background: #090d16;
            border: 2px solid #FF6B35;
            /* Orange for sale */
            border-radius: 8px;
            color: #ffffff;
            font-weight: 800;
            font-size: 10.5px;
            padding: 4px 7px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.4);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .zillow-price-marker.rental {
            border-color: #a855f7;
            /* Purple for rental */
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.4);
        }

        .zillow-price-marker.cluster {
            border-color: #06b6d4;
            /* Cyan for cluster stacks */
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.5);
        }

        .zillow-price-marker:hover {
            transform: scale(1.15);
            background: #111827;
            z-index: 1000 !important;
        }

        /* High Contrast glowing card borders (Accents: Orange, Cyan, Purple) */
        .property-card-glow {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .property-card-glow:hover {
            box-shadow: 0 0 25px rgba(255, 107, 53, 0.35), 0 0 12px rgba(6, 182, 212, 0.2);
            border-color: #FF6B35;
            background-color: rgba(22, 28, 45, 0.8);
            transform: translateY(-3px);
        }

        /* Neon Borders & Panels (Nara Orange gradient) */
        .neon-panel {
            border: 1px solid rgba(255, 107, 53, 0.3);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(9, 13, 22, 0.95));
            box-shadow: 0 12px 45px 0 rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(255, 107, 53, 0.08);
        }

        .item-icon {
            image-rendering: pixelated;
        }

        /* Price Slider track adjustment */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FF6B35;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.8);
            transition: transform 0.15s, background-color 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FF6B35;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.8);
            transition: transform 0.15s, background-color 0.15s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            background: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
        }

        /* Custom Fancy summary dropdowns styling (matching /shops style) */
        .custom-dropdown-menu button {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-dropdown-menu button:hover {
            background: linear-gradient(90deg, rgba(255, 107, 53, 0.2), rgba(168, 85, 247, 0.2));
            color: #FF6B35;
            padding-left: 18px;
        }

        /* Leaflet wrapper sizing safe fallback */
        #homes-map {
            width: 100% !important;
            height: 100% !important;
            min-height: 450px;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>

    <div class="h-[80px] flex-shrink-0"></div>

    <div id="listings-view" class="flex flex-col flex-grow w-full">
        <div class="flex flex-col lg:flex-row flex-grow portal-height w-full overflow-hidden">
            <div
                class="w-full lg:w-3/5 h-[450px] lg:h-full relative border-b lg:border-b-0 lg:border-r border-slate-800 flex-shrink-0 overflow-hidden">
                <div id="homes-map" class="w-full h-full"></div>
                <div
                    class="absolute bottom-4 left-4 bg-slate-950/90 border border-slate-800/80 rounded-lg px-3 py-1.5 font-mono text-xs text-slate-300 z-[900] pointer-events-none shadow-lg">
                    X: <span id="map-hover-x" class="text-orange-400 font-bold">0</span>, Z: <span id="map-hover-z"
                        class="text-orange-400 font-bold">0</span>
                </div>
            </div>

            <div class="w-full lg:w-2/5 h-full flex flex-col bg-slate-950 flex-grow border-l border-slate-900">

                <div
                    class="px-6 py-5 border-b border-slate-800 bg-slate-900/40 neon-panel flex flex-col gap-4 flex-shrink-0">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base font-extrabold text-white flex items-center gap-2 tracking-tight">
                            <i data-feather="sliders" class="w-4 h-4 text-orange-400"></i> Search & Filters
                        </h2>
                        <span id="listings-count"
                            class="text-xs bg-gradient-to-r from-orange-500 via-purple-500 to-cyan-500 text-white border border-orange-500/30 rounded-full px-2.5 py-0.5 font-bold shadow-[0_0_15px_rgba(255,107,53,0.35)]">0
                            listings</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col relative">
                            <label
                                class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider mb-1.5 ml-1">Region /
                                Location</label>
                            <details class="group custom-dropdown" id="dropdown-city">
                                <summary
                                    class="flex justify-between items-center bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-full px-4 py-2.5 font-bold cursor-pointer hover:border-orange-400 transition-colors select-none">
                                    <span id="selected-city">All Locations</span>
                                    <i data-feather="chevron-down"
                                        class="w-3.5 h-3.5 text-orange-400 transition-transform group-open:rotate-180"></i>
                                </summary>
                                <div class="absolute left-0 top-[calc(100%+6px)] w-full bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col divide-y divide-slate-800/60 custom-dropdown-menu"
                                    id="city-options">
                                    <button onclick="selectOption('city', 'all', 'All Locations')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">All
                                        Locations</button>
                                </div>
                            </details>
                        </div>

                        <div class="flex flex-col relative">
                            <label
                                class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider mb-1.5 ml-1">Building
                                Style</label>
                            <details class="group custom-dropdown" id="dropdown-building-type">
                                <summary
                                    class="flex justify-between items-center bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-full px-4 py-2.5 font-bold cursor-pointer hover:border-orange-400 transition-colors select-none">
                                    <span id="selected-building-type">All Buildings</span>
                                    <i data-feather="chevron-down"
                                        class="w-3.5 h-3.5 text-orange-400 transition-transform group-open:rotate-180"></i>
                                </summary>
                                <div
                                    class="absolute left-0 top-[calc(100%+6px)] w-full bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col divide-y divide-slate-800/60 custom-dropdown-menu">
                                    <button onclick="selectOption('building-type', 'all', 'All Buildings')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">All
                                        Buildings</button>
                                    <button onclick="selectOption('building-type', 'home', 'Home')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">Home</button>
                                    <button onclick="selectOption('building-type', 'apartment', 'Apartment')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">Apartment</button>
                                    <button onclick="selectOption('building-type', 'house_shop', 'House & Shop')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">House
                                        & Shop</button>
                                    <button onclick="selectOption('building-type', 'hotel_room', 'Hotel Room')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">Hotel
                                        Room</button>
                                </div>
                            </details>
                        </div>

                        <div class="flex flex-col relative">
                            <label
                                class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider mb-1.5 ml-1">Listing
                                Category</label>
                            <details class="group custom-dropdown" id="dropdown-type">
                                <summary
                                    class="flex justify-between items-center bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-full px-4 py-2.5 font-bold cursor-pointer hover:border-orange-400 transition-colors select-none">
                                    <span id="selected-type">Sale & Rental</span>
                                    <i data-feather="chevron-down"
                                        class="w-3.5 h-3.5 text-orange-400 transition-transform group-open:rotate-180"></i>
                                </summary>
                                <div
                                    class="absolute left-0 top-[calc(100%+6px)] w-full bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col divide-y divide-slate-800/60 custom-dropdown-menu">
                                    <button onclick="selectOption('type', 'all', 'Sale & Rental')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">Sale
                                        & Rental</button>
                                    <button onclick="selectOption('type', 'sale', 'For Sale')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">For
                                        Sale</button>
                                    <button onclick="selectOption('type', 'rental', 'Rental Only')"
                                        class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold">Rental
                                        Only</button>
                                </div>
                            </details>
                        </div>

                        <div class="flex flex-col px-1.5">
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider">Max
                                    Cost</label>
                                <span id="price-val" class="text-[10px] font-bold text-orange-450">All Prices</span>
                            </div>
                            <div class="py-2.5 flex items-center">
                                <input type="range" id="filter-price" min="0" max="200" step="1" value="200"
                                    class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-orange-400"
                                    oninput="updatePriceLabel(this.value); applyFilters()">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="listings-container"
                    class="flex-grow overflow-y-auto px-6 py-5 grid grid-cols-1 sm:grid-cols-2 gap-4 auto-rows-min content-start custom-scroll">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global Portal State
        let allListings = [];
        let map = null;
        let mapMarkers = [];

        // Filter values state
        let selectedFilters = {
            city: 'all',
            buildingType: 'all',
            type: 'all',
            maxPrice: 200
        };

        // Assets
        const DIAMOND_ICON_URL = "https://ccvaults.com/assets/10.%20Items/11.%20Materials/Diamond.png";

        // Leaflet Terrain Tile Config
        const TILE_URL = 'https://civmc-map.duckdns.org/tiles/terrain/z{z}/{x},{y}.png';

        // Coordinate conversion helper
        function toLatLng(x, z) {
            return L.latLng(-z, x);
        }
        function fromLatLng(latlng) {
            return { x: latlng.lng, z: -latlng.lat };
        }

        // Coordinate parser
        function parseCoordinates(coordStr) {
            if (!coordStr) return null;
            const matches = coordStr.match(/-?\d+/g);
            if (!matches || matches.length < 2) return null;
            if (matches.length === 2) {
                return { x: parseInt(matches[0], 10), z: parseInt(matches[1], 10) };
            } else {
                return { x: parseInt(matches[0], 10), y: parseInt(matches[1], 10), z: parseInt(matches[2], 10) };
            }
        }

        // Initialize Map 
        function initMap() {
            map = L.map('homes-map', {
                crs: L.CRS.Simple,
                minZoom: -6,
                maxZoom: 2,
                zoomControl: false,
                attributionControl: false,
                preferCanvas: true
            });

            // Terrain Tile layer
            L.tileLayer(TILE_URL, {
                tileSize: 256,
                minZoom: -6,
                maxZoom: 2,
                maxNativeZoom: 0,
                noWrap: true,
                bounds: [[-25600, -25600], [25600, 25600]]
            }).addTo(map);

            // Default Shiroyama center
            map.setView(toLatLng(3227, 4792), -3);

            // Zoom controls
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Mouse coordinates tracking
            map.on('mousemove', function (e) {
                const point = fromLatLng(e.latlng);
                document.getElementById('map-hover-x').textContent = Math.round(point.x);
                document.getElementById('map-hover-z').textContent = Math.round(point.z);
            });
        }

        // Custom Dropdown Option Handler
        function selectOption(filterKey, value, displayLabel) {
            if (filterKey === 'city') {
                selectedFilters.city = value;
                document.getElementById('selected-city').textContent = displayLabel;
                document.getElementById('dropdown-city').removeAttribute('open');
            } else if (filterKey === 'building-type') {
                selectedFilters.buildingType = value;
                document.getElementById('selected-building-type').textContent = displayLabel;
                document.getElementById('dropdown-building-type').removeAttribute('open');
            } else if (filterKey === 'type') {
                selectedFilters.type = value;
                document.getElementById('selected-type').textContent = displayLabel;
                document.getElementById('dropdown-type').removeAttribute('open');
            }
            applyFilters();
        }

        // Close custom dropdowns when clicking outside
        document.addEventListener('click', function (e) {
            document.querySelectorAll('.custom-dropdown').forEach(dropdown => {
                if (!dropdown.contains(e.target)) {
                    dropdown.removeAttribute('open');
                }
            });
        });

        // Helper to format building types for human readability
        function formatBuildingType(type) {
            if (!type) return 'Home';
            switch (type.toLowerCase()) {
                case 'home': return 'Home';
                case 'apartment': return 'Apartment';
                case 'house_shop':
                case 'house_and_shop': return 'House & Shop';
                case 'hotel_room': return 'Hotel Room';
                default: return type;
            }
        }

        // Fetch properties from Sanity CMS API
        async function loadProperties() {
            const query = encodeURIComponent(`*[_type == "listingPost"] {
                _id,
                address,
                coordinates,
                price,
                is_rental,
                city,
                listing_owner,
                building_type,
                "schematicUrl": schematic_file.asset->url,
                "images": images[].asset->url
            }`);

            try {
                const response = await fetch(`https://scdpub0o.apicdn.sanity.io/v2021-10-21/data/query/production?query=${query}`);

                if (!response.ok) {
                    throw new Error(`Sanity CDN returned status code: ${response.status}`);
                }

                const data = await response.json();
                allListings = data.result || [];

                // Populate filters and UI
                populateCityDropdown();
                renderListings();
                plotMarkers();
                updateListingsCount(getFilteredListings().length);
            } catch (err) {
                console.error("Failed to load listings from Sanity CMS:", err);
                renderSanityCorsAlert();
            }
        }

        function renderSanityCorsAlert() {
            const container = document.getElementById('listings-container');
            container.innerHTML = `
            <div class="bg-red-950/20 border border-red-800/40 rounded-xl p-5 flex flex-col gap-4 text-slate-300 shadow-lg">
                <div class="flex items-center gap-2 border-b border-red-800/30 pb-3">
                    <i data-feather="alert-triangle" class="w-5 h-5 text-red-400"></i>
                    <h3 class="font-extrabold text-sm text-white tracking-wide uppercase">CORS Origin Config Blocked</h3>
                </div>
                <div class="text-xs leading-relaxed flex flex-col gap-2.5">
                    <p>Sanity CMS successfully denied your browser's cross-origin query (403 Forbidden). By default, Sanity blocks requests from unauthorized domains.</p>
                    <p class="font-bold text-white">To resolve this error instantly:</p>
                    <ol class="list-decimal list-inside pl-1 space-y-1">
                        <li>Navigate to <a href="https://manage.sanity.io" target="_blank" class="text-cyan-400 font-semibold hover:underline">manage.sanity.io</a></li>
                        <li>Open project <span class="bg-slate-900 border border-slate-800 px-1.5 py-0.5 rounded font-mono font-bold text-[11px] text-cyan-300">nara-zillow</span></li>
                        <li>Go to <span class="text-slate-200 font-medium">API</span> tab → <span class="text-slate-200 font-medium">CORS Origins</span></li>
                        <li>Click <span class="text-slate-200 font-medium">Add CORS Origin</span> and paste your URL:
                            <div class="bg-slate-950 border border-slate-900 rounded p-2 mt-1.5 font-mono text-[10px] text-slate-400 flex flex-col gap-0.5">
                                <span>Active Origin: <span class="text-green-400 font-bold">${window.location.origin}</span></span>
                            </div>
                        </li>
                    </ol>
                </div>
            </div>`;
            if (window.feather) feather.replace();
        }

        // Populate location filter options
        function populateCityDropdown() {
            const select = document.getElementById('city-options');
            const cities = [...new Set(allListings.map(l => l.city).filter(Boolean))].sort();

            cities.forEach(city => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:text-white cursor-pointer font-semibold";
                btn.onclick = () => selectOption('city', city, city);
                btn.textContent = city;
                select.appendChild(btn);
            });
        }

        // Plot interactive pins with 5-distance clustering rules
        function plotMarkers() {
            mapMarkers.forEach(m => m.remove());
            mapMarkers = [];

            const filtered = getFilteredListings();
            const clusters = [];

            // Execute custom coordinate spatial clustering
            filtered.forEach(listing => {
                const coords = parseCoordinates(listing.coordinates);
                if (!coords) return;

                // Match dynamically within 5 units threshold using Euclidean distance calculation
                let foundCluster = clusters.find(c => {
                    const dist = Math.hypot(c.x - coords.x, c.z - coords.z);
                    return dist <= 5;
                });

                if (foundCluster) {
                    foundCluster.listings.push(listing);
                } else {
                    clusters.push({
                        x: coords.x,
                        z: coords.z,
                        listings: [listing]
                    });
                }
            });

            // Map generation looping logic for unique markers and clustered units
            clusters.forEach(cluster => {
                const latlng = toLatLng(cluster.x, cluster.z);
                let pinIcon;
                let popupHtml = '';

                if (cluster.listings.length === 1) {
                    // Original single property tracking behavior
                    const listing = cluster.listings[0];
                    const isRental = listing.is_rental;
                    const priceText = listing.price === 0 ? 'Free' : `${listing.price}`;
                    const priceSuffix = isRental ? '/mo' : '';
                    const pinColorClass = isRental ? 'rental' : '';

                    pinIcon = L.divIcon({
                        className: 'zillow-price-marker-wrap',
                        html: `
                        <div class="zillow-price-marker ${pinColorClass}">
                            <img src="${DIAMOND_ICON_URL}" class="w-3.5 h-3.5 item-icon select-none inline-block align-middle">
                            <span>${priceText}${priceSuffix}</span>
                        </div>`,
                        iconSize: [null, null],
                        iconAnchor: [30, 12]
                    });

                    const imageSection = listing.images && listing.images[0]
                        ? `<img
    src="${listing.images[0]}"
    width="320"
    height="180"
    class="block w-full aspect-video object-cover"
    loading="lazy"
>`
                        : `<div class="w-full h-24 bg-slate-850 flex flex-col items-center justify-center border-b border-slate-800 text-slate-400 font-mono text-[10px]"><span class="font-bold">No Property Images</span></div>`;

                    const priceDisplay = listing.price === 0
                        ? 'Free'
                        : `<img src="${DIAMOND_ICON_URL}" class="w-4.5 h-4 item-icon select-none inline-block align-middle"> ${listing.price}`;

                    const typeString = `${formatBuildingType(listing.building_type)} for ${isRental ? 'rent' : 'sale'}`;

                    popupHtml = `
                    <div class="bg-slate-900 text-slate-100 rounded-lg overflow-hidden w-64 shadow-2xl font-sans" style="font-family: inherit;">
                        ${imageSection}
                        <div class="p-4 flex flex-col gap-2">
                            <div class="flex justify-between items-center gap-2">
                                <span class="text-sm font-extrabold text-white flex items-center gap-1.5">${priceDisplay}${priceSuffix}</span>
                                <span class="text-[8px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${isRental ? 'bg-purple-950 text-purple-300 border border-purple-800' : 'bg-orange-950 text-orange-300 border border-orange-800'}">${isRental ? 'Rental' : 'For Sale'}</span>
                            </div>
                            <div class="text-xs text-slate-300 font-medium">
                                <span>${typeString}</span>
                                <span class="mx-1.5 text-slate-600">|</span>
                                <span>${listing.listing_owner || 'Unknown'}</span>
                            </div>
                            <address class="not-italic text-sm font-bold text-white truncate mt-0.5">${listing.address || 'Unnamed Property'}, ${listing.city}</address>
                            <div class="text-[9px] text-slate-500 font-bold uppercase mt-1">Listed by ${listing.listing_owner || 'Government'}</div>
                            <button onclick="navigateToDetail('${listing._id}')" class="w-full text-center py-2 mt-2 bg-gradient-to-r from-orange-500 via-purple-500 to-cyan-500 hover:from-orange-400 hover:to-cyan-400 text-white text-xs font-bold rounded-lg transition-all shadow-md">View Property</button>
                        </div>
                    </div>`;
                } else {
                    // Combine into stacked cluster format (Cyan theme styling)
                    pinIcon = L.divIcon({
                        className: 'zillow-price-marker-wrap',
                        html: `
                        <div class="zillow-price-marker cluster">
                            <i data-feather="layers" class="w-3.5 h-3.5 text-cyan-400 inline-block align-middle"></i>
                            <span>${cluster.listings.length} Units</span>
                        </div>`,
                        iconSize: [null, null],
                        iconAnchor: [35, 12]
                    });

                    // Target first image found inside cluster index
                    const firstListing = cluster.listings[0];
                    const imageSection = firstListing.images && firstListing.images[0]
                        ? `<img
    src="${firstListing.images[0]}"
    width="320"
    height="180"
    class="block w-full aspect-video object-cover"
    loading="lazy"
>`
                        : `<div class="w-full h-24 bg-slate-850 flex flex-col items-center justify-center border-b border-slate-800 text-slate-400 font-mono text-[10px]"><span class="font-bold">No Property Images</span></div>`;

                    // Parse interactive structural rows comfortably fitting 2-5 entries smoothly
                    let rowsHtml = '';
                    cluster.listings.forEach(l => {
                        const lCoords = parseCoordinates(l.coordinates) || { x: cluster.x, z: cluster.z };
                        const rowPrice = l.price === 0
                            ? 'Free'
                            : `<img src="${DIAMOND_ICON_URL}" class="w-3.5 h-3.5 item-icon select-none inline-block align-middle"> ${l.price}`;
                        const priceSuffix = l.is_rental ? '/mo' : '';

                       rowsHtml += `
<div
    onclick="navigateToDetail('${l._id}')"
    class="py-2 px-2 border-b border-slate-800/60 last:border-b-0 cursor-pointer hover:bg-slate-800/40 rounded transition-colors"
>
    <div class="flex items-center justify-between gap-3">

        <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-white break-words leading-tight">
                ${l.address || 'Unknown Property'}
            </div>

            <div class="text-[9px] text-slate-400 font-mono mt-1">
                X:${lCoords.x} Z:${lCoords.z}
            </div>
        </div>

        <div class="flex-shrink-0 flex items-center gap-3 self-center">

            <div class="flex items-center gap-1 text-[11px] font-bold text-cyan-400 text-right leading-tight">
                ${
                    l.price === 0
                        ? 'Free'
                        : `<><img src="${DIAMOND_ICON_URL}" class="w-3 h-3 item-icon flex-shrink-0"> ${l.price}</>`
                }
                ${l.is_rental ? '/mo' : ''}
            </div>

            <button
                onclick="event.stopPropagation(); navigateToDetail('${l._id}')"
                class="px-2 py-1 text-[9px] bg-orange-500 hover:bg-orange-400 rounded font-bold text-white flex-shrink-0"
            >
                View
            </button>

        </div>

    </div>
</div>`;
                    });

                    popupHtml = `
                   <div class="bg-slate-900 text-slate-100 rounded-lg overflow-hidden max-w-[500px] shadow-2xl font-sans">
                        ${imageSection}
                        <div class="p-3 bg-slate-950/50 border-b border-slate-800 flex justify-between items-center">
                            <span class="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider flex items-center gap-1">
                                <i data-feather="layers" class="w-3.5 h-3.5"></i> Multiple Listings
                            </span>
                            <span class="text-[9px] bg-slate-800 text-slate-300 font-mono font-bold px-2 py-0.5 rounded-full">${cluster.listings.length} Units</span>
                        </div>
                        <div class="p-4 flex flex-col max-h-52 overflow-y-auto custom-scroll divide-y divide-slate-800/30">
                            ${rowsHtml}
                        </div>
                    </div>`;
                }

                const marker = L.marker(latlng, { icon: pinIcon }).addTo(map);
                marker.bindPopup(popupHtml, {
                    closeButton: true,
                    offset: [0, -5]
                });

marker.on('popupopen', function(e) {
    const imgs = e.popup.getElement().querySelectorAll('img');

    imgs.forEach(img => {
        img.onload = () => e.popup.update();
    });
});
                marker.on('click', function () {
                    map.panTo(latlng);
                });

                mapMarkers.push(marker);
            });

            if (window.feather) feather.replace();
        }

        // Get matching listings
        function getFilteredListings() {
            return allListings.filter(l => {
                if (selectedFilters.city !== 'all' && l.city !== selectedFilters.city) return false;

                // Normalized check to cover alternate 'house_shop' & 'house_and_shop' variations natively
                let listBType = l.building_type ? l.building_type.toLowerCase() : 'home';
                if (listBType === 'house_and_shop') listBType = 'house_shop';

                if (selectedFilters.buildingType !== 'all' && listBType !== selectedFilters.buildingType) return false;

                if (selectedFilters.type === 'sale' && l.is_rental) return false;
                if (selectedFilters.type === 'rental' && !l.is_rental) return false;

                if (l.price > selectedFilters.maxPrice) return false;

                return true;
            });
        }

        // Render card layout on right side
        function renderListings() {
            const container = document.getElementById('listings-container');
            container.innerHTML = '';

            const filtered = getFilteredListings();
            updateListingsCount(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = `
                <div class="py-16 flex flex-col items-center justify-center text-slate-500 gap-3 border border-slate-900 rounded-xl bg-slate-900/10">
                    <i data-feather="home" class="w-8 h-8 text-slate-700"></i>
                    <p class="text-xs font-semibold text-slate-600">No properties found matching criteria.</p>
                </div>`;
                if (window.feather) feather.replace();
                return;
            }

            filtered.forEach(listing => {
                const coords = parseCoordinates(listing.coordinates);
                const isRental = listing.is_rental;

                const card = document.createElement('div');
                card.className = `bg-slate-900/30 border border-slate-900 rounded-xl overflow-hidden cursor-pointer transition-all duration-300 flex flex-col property-card-glow`;

                card.onclick = () => {
                    navigateToDetail(listing._id);
                };

                const tagHtml = `<span class="absolute top-2.5 left-2.5 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-md shadow-lg ${isRental ? 'bg-purple-600 text-white' : 'bg-orange-500 text-white'}">${isRental ? 'For Rent' : 'For Sale'}</span>`;

                const imgHtml = listing.images && listing.images[0]
                    ? `<div class="relative w-full h-40 flex-shrink-0">
                        <img src="${listing.images[0]}" class="w-full h-full object-cover select-none" alt="Property Image">
                        ${tagHtml}
                       </div>`
                    : `<div class="relative w-full h-32 flex-shrink-0 bg-slate-950/80 flex items-center justify-center border-b border-slate-800">
                        <div class="flex flex-col items-center text-slate-500 font-mono text-xs">
                            <i data-feather="image" class="w-6 h-6 mb-1 text-slate-700"></i>
                            <span class="text-[10px] text-slate-600">No Property Images</span>
                        </div>
                        ${tagHtml}
                       </div>`;

                const priceDisplay = listing.price === 0
                    ? 'Free'
                    : `<img src="${DIAMOND_ICON_URL}" class="w-5 h-5 item-icon select-none inline-block align-middle"> ${listing.price}`;
                const priceSuffix = isRental ? '/mo' : '';

                const addressHtml = listing.address
                    ? `<div class="text-xs text-white font-bold truncate">${listing.address}${listing.city ? ', ' + listing.city : ''}</div>`
                    : (listing.city ? `<div class="text-xs text-white font-bold truncate">${listing.city}</div>` : '');

                const coordsHtml = coords
                    ? `<div class="text-[10px] text-slate-400 font-mono font-semibold">X: ${coords.x}, Z: ${coords.z}</div>`
                    : '';

                card.innerHTML = `
                    ${imgHtml}
                    <div class="p-3.5 flex flex-col gap-1.5">
                        <div class="text-lg font-extrabold text-cyan-400 flex items-center gap-1.5">${priceDisplay}${priceSuffix}</div>
                        ${coordsHtml}
                        ${addressHtml}
                        <div class="text-[9px] text-slate-500 font-semibold uppercase tracking-wide pt-1 border-t border-slate-800/50 mt-0.5">Listed by ${listing.listing_owner || 'Government'}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            if (window.feather) feather.replace();
        }

        function applyFilters() {
            renderListings();
            plotMarkers();
        }

        function updatePriceLabel(val) {
            selectedFilters.maxPrice = parseInt(val, 10);
            const label = document.getElementById('price-val');
            if (parseInt(val, 10) === 200) {
                label.textContent = "All Prices";
            } else {
                label.innerHTML = `
≤
<img src="${DIAMOND_ICON_URL}"
     class="w-3 h-3 inline-block item-icon mx-0.5 align-middle">
${val}`;
            }
        }

        function updateListingsCount(count) {
            document.getElementById('listings-count').textContent = `${count} ${count === 1 ? 'listing' : 'listings'}`;
        }

        function navigateToDetail(id) {
            window.location.href = `/homes/view/?id=` + id;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadProperties();

            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                }
            }, 350);
        });
    </script>
</body>

</html>
