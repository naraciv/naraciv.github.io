packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Security fixes for transitive dependencies whose parents don't allow the patched version yet
# (Dependabot alerts). Each is scoped to the vulnerable range; drop it once the parent catches up.
overrides:
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=4 <5.0.12: ^5.0.12
  adm-zip@<0.6.1: ^0.6.1
  js-yaml@<3.15.2: ^3.15.2
  dompurify@<3.4.16: ^3.4.16
  smol-toml@<1.9.0: ^1.9.0
  uuid@<11.1.1: ^11.1.1
