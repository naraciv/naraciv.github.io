<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){if(localStorage.getItem('nara_theme')==='dark')document.documentElement.classList.add('dark')})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=https://map.civinfo.net/datasource/https:!.!.meenos1.github.io!.overland-rail.json">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --link-color: #0000ee;
            --table-border: #cccccc;
            --table-bg: #f9f9f9;
        }

        html.dark {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --link-color: #8ab4f8;
            --table-border: #444444;
            --table-bg: #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        a {
            color: var(--link-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            border: 1px solid var(--table-border);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--table-bg);
        }

        .map-container {
            width: 100%;
            height: 400px;
            background-color: var(--table-bg);
            border: 1px solid var(--table-border);
        }
    </style>
    <script src="../components/analytics.js"></script>
</head>
<body>
    <p>Redirecting to Nara Properties...</p>
    <p>If you are not redirected automatically, <a href="https://map.civinfo.net/datasource/https:!.!.meenos1.github.io!.overland-rail.json">click here</a>.</p>
</body>
</html>
