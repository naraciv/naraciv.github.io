<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname;
            var segments = path.split('/').filter(p => p);
            
            // Check if we are in /stats/{username}
            var statsIndex = segments.indexOf('stats');
            
            if (statsIndex !== -1) {
                var trailing = segments.slice(statsIndex + 1);
                var basePath = '/' + segments.slice(0, statsIndex + 1).join('/');

                // Only rewrite pretty profile URLs like /stats/SomePlayer.
                if (trailing.length === 1) {
                    var slug = trailing[0];
                    if (slug !== 'user' && slug !== 'index.html') {
                        var username = slug;
                        try {
                            username = decodeURIComponent(slug);
                        } catch (e) {}
                        window.location.replace(basePath + '/user/?player=' + encodeURIComponent(username));
                        return;
                    }
                }

                // If we landed on the stats root path, go to the list page.
                if (trailing.length === 0 || (trailing.length === 1 && trailing[0] === 'index.html')) {
                    window.location.replace(basePath + '/');
                    return;
                }
            }

            // Check if we are in /homes/...
            var homesIndex = segments.indexOf('homes');
            if (homesIndex !== -1) {
                var trailing = segments.slice(homesIndex + 1);
                var basePath = '/' + segments.slice(0, homesIndex + 1).join('/');

                if (trailing.length === 2 && trailing[0] === 'view') {
                    // /homes/view/<id> -> /homes/view/?id=<id>
                    window.location.replace('/homes/view/?id=' + encodeURIComponent(trailing[1]));
                    return;
                } else if (trailing.length === 1 && trailing[0] !== 'index.html' && trailing[0] !== 'view') {
                    // /homes/<id> -> /homes/view/?id=<id>
                    window.location.replace('/homes/view/?id=' + encodeURIComponent(trailing[0]));
                    return;
                } else if (trailing.length === 0 || (trailing.length === 1 && trailing[0] === 'index.html')) {
                    window.location.replace('/homes/');
                    return;
                }
            }

            {
                // Fallback to home if not a stats or homes route
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body class="bg-slate-950 text-slate-200">
    <p>Redirecting...</p>
</body>
</html>
